name: inference-scheduler tests

# Cheap, no-hardware checks for the Python code generator.  Runs on GitHub's
# free hosted Ubuntu runners — no Vitis HLS, no FPGA tools, no self-hosted
# infra needed.  Heavier kernel verification (HLS synthesis, RTL behavior,
# on-device tests) belongs in separate workflows targeting self-hosted
# runners.

on:
  push:
    branches: [main]
    paths:
      - 'inference-scheduler/**'
      - 'platforms/**'
      - 'demo/bert_squad/scripts/**'
      - '.github/workflows/inference-scheduler-tests.yml'
  pull_request:
    paths:
      - 'inference-scheduler/**'
      - 'platforms/**'
      - 'demo/bert_squad/scripts/**'
      - '.github/workflows/inference-scheduler-tests.yml'
  workflow_dispatch:

# Cancel an in-flight run when a newer commit lands on the same branch / PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12']
    defaults:
      run:
        working-directory: inference-scheduler
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: inference-scheduler/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov 'ruff>=0.15,<0.16'

      - name: Lint with ruff
        # Fail fast on lint errors so we don't waste minutes on test runs
        # that can't merge anyway.  Configuration lives in pyproject.toml.
        run: ruff check .

      - name: Generate test ONNX models
        # All gen_*_models.py invocations bundled — see test/gen_all_models.py.
        run: python test/gen_all_models.py

      - name: Cache the BERT-SQuAD assets
        # test_bert_base.py runs on the real bertsquad-12 (435 MB, from Google
        # Drive) plus vocab.txt / dev-v1.1.json: fetched once, then cached.
        # Bump the key's md5 when fetch_assets.py points at another model.
        uses: actions/cache@v4
        with:
          path: |
            demo/bert_squad/assets/models/bertsquad-12-simplified.onnx
            demo/bert_squad/assets/vocab.txt
            demo/bert_squad/assets/dev-v1.1.json
          key: bert-squad-assets-f6818d482d18e703fbd8d7c3b609a98a

      - name: Fetch the BERT-SQuAD assets
        # A download failure (Drive quota, network) does not fail the job:
        # test_bert_base.py then skips with the reason in the pytest summary.
        continue-on-error: true
        run: python ../demo/bert_squad/scripts/fetch_assets.py

      - name: Run pytest with coverage
        env:
          BERT_SQUAD_DOWNLOAD: '0'   # fetched above; don't retry inside pytest
        run: |
          python -m pytest test/ -v --tb=short \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov

      - name: Append coverage summary to job summary
        # Renders as a markdown table on the workflow run page (Summary tab).
        # Runs even if pytest failed so we still see what was covered.
        if: always()
        run: |
          echo '## Code coverage (`src/`)' >> "$GITHUB_STEP_SUMMARY"
          python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage HTML report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-html-py${{ matrix.python-version }}
          path: inference-scheduler/htmlcov/
          retention-days: 14

      - name: Upload coverage XML report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-xml-py${{ matrix.python-version }}
          path: inference-scheduler/coverage.xml
          retention-days: 14
