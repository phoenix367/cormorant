    driver: 'build*/kernels/pool_rtl/driver/PoolingKernel_v1_0/src/xpoolingkernel_hw.h'
    not_keyed: {x: address, y: address}
    decode: inference-scheduler/src/timeline_html.py
    writers_all:
      - inference-scheduler/src/codegen/_source.py
      - inference-scheduler/bench_src/calib_runner.c
      - inference-scheduler/bench_src/bench_pool.c

- id: registers.RowOpsKernel
  kind: interface
  title: RowOpsKernel AXI-Lite registers (the row-ops unit, HOSTOPS_PLAN phase 1-2; RTL only until phase 3)
  check: register_map
  args:
    kernel: RowOpsKernel
    prefix: XRowopskernel
    rtl_driver: kernels/rowops_rtl/scripts/gen_driver.py     # the truth: the RTL kernel's table,
    rtl: kernels/rowops_rtl/rtl/ro_ctrl_s_axi.sv             # checked against its control block
    driver: 'build*/kernels/rowops_rtl/driver/RowOpsKernel_v1_0/src/xrowopskernel_hw.h'
    not_keyed: {a: address, b: address, c: address, p: "address of the parameter block",
                eps: "NORM's epsilon term (no effect on timing)", bq_sh: "the beta shift (no effect on timing)"}
    decode: inference-scheduler/src/timeline_html.py
    writers_all:
      - inference-scheduler/src/codegen/_source.py

- id: vectorop.codes
  kind: interface
  title: VectorOP op / act codes (the Op and Act enums) and their copies
  producer: {file: kernels/vectorop_rtl/model/include/VectorOP.h, regex: '^\s*((?:OP|ACT)_\w+)\s*=\s*(\d+)', as: dict}
  consumers:
    - {name: scheduler constants, file: inference-scheduler/src/nodes.py, regex: '^((?:OP|ACT)_\w+)\s*=\s*(\d+)', as: dict}
    - {name: CLAUDE.md operations table, file: CLAUDE.md, regex: '^\| (\d+) \| `(OP_\w+)`', as: dict, swap: true, keys: 'OP_*'}
    - {name: run_remote_perf._OP_NAMES, file: inference-scheduler/run_remote_perf.py, regex: '^_OP_NAMES = (\[.*\])',
       transform: "{'OP_' + n: i for i, n in enumerate(ast(v))}", keys: 'OP_*'}
    - {name: timeline DECODE, file: inference-scheduler/src/timeline_html.py,
       regex: 'VectorOPKernel: \{op: (\[[^\]]*\]), act: (\[[^\]]*\])',
       transform: "dict([('OP_' + n.upper(), i) for i, n in enumerate(ast(v[0]))] + [('ACT_' + n.upper(), i) for i, n in enumerate(ast(v[1]))])"}

