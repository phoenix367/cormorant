    lut_pct: {file: hw/cormorant_hw_128/cormorant_hw_128.runs/impl_1/design_cormorant_wrapper_utilization_placed.rpt, regex: '^\| CLB LUTs\s+\|.*\|\s+([\d.]+) \|$', type: float}
    dsp_pct: {file: hw/cormorant_hw_128/cormorant_hw_128.runs/impl_1/design_cormorant_wrapper_utilization_placed.rpt, regex: '^\| DSPs\s+\|.*\|\s+([\d.]+) \|$', type: float}
    bram: {file: hw/cormorant_hw_128/cormorant_hw_128.runs/impl_1/design_cormorant_wrapper_utilization_placed.rpt, regex: '^\| Block RAM Tile\s+\|\s+([\d.]+) ', type: float}
