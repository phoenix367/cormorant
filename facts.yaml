       regex: 'ships with \*\*(?P<total>\d+) benchmark cases\*\*\s+across the four kernels \((?P<vectorop>\d+) VectorOPKernel, (?P<matmul>\d+) MatmulKernel'}
    - {file: doc/build-and-test/TESTING.md, regex: '§8b — (?P<conv>\d+) ConvKernel, (?P<pool>\d+) PoolingKernel\)'}
    - {file: inference-scheduler/doc/REMOTE_TESTING.md, regex: 'Performance benchmarks — (?P<total>\d+) cases;'}
