# facts.yaml — facts that code and docs state in several places: where each
# one is true (source / producer / provenance) and every place that repeats it
# (mentions / consumers).  Checked by tools/facts/facts.py (format and
# workflow: tools/facts/README.md):
#
#   python3 tools/facts/facts.py check            # all facts; exit 1 on a failure
#   python3 tools/facts/facts.py fix              # rewrite stale `fix: auto` mentions
#   python3 tools/facts/facts.py changed          # the facts a change touches + files to review
#   python3 tools/facts/facts.py impact PATH|ID   # what a file is part of / what a fact ties together
#
# Kinds: value (derived from the code), interface (components that must
# agree), recorded (measured; value + provenance, stale when its inputs change).
# Regex locators: Python syntax, multiline; group 1 (or named groups for a
# mapping value) is the quoted text.  Markers in prose:
# <!-- fact:ID -->VALUE<!-- /fact --> (or fact:ID.KEY) are found anywhere.

python: inference-scheduler/.venv/bin/python     # runs `py:` sources and {python} in commands

facts:

# ── test counts ──────────────────────────────────────────────────────────────
- id: scheduler.test_count
  kind: value
  title: tests the scheduler suite collects
  source:
    cmd: "{python} -m pytest test/ --collect-only -q -p no:cacheprovider --color=no"
    cwd: inference-scheduler
    parse: '(\d+) tests? collected'
    type: int
  watch: ['inference-scheduler/test/test_*.py']
  fix: auto
  mentions:
    - {file: CLAUDE.md, regex: 'Run all tests \((\d+) tests'}
    - {file: inference-scheduler/CLAUDE.md, regex: 'pytest modules, (\d+) tests'}
    - {file: doc/scheduler/INFERENCE_SCHEDULER.md, regex: 'Run the full test suite \((\d+) tests'}
    - {file: inference-scheduler/doc/USER_GUIDE.md, regex: 'Run the full test suite \((\d+) tests'}
    - {file: doc/build-and-test/TESTING.md, regex: 'Run all (\d+) tests in \d+ modules'}
    - {file: doc/build-and-test/TESTING.md, regex: 'planning \((\d+) tests\)'}
    - {file: README.md, regex: 'pytest test/ -q +# (\d+) tests'}
    - {file: .claude/agents/run-tests.md, regex: 'pytest `test/` \((\d+) tests'}
    - {file: .claude/agents/run-tests/baselines.json, regex: '"scheduler": \{[^}]*?"min_tests": (\d+)', dotall: true}
    - {file: .claude/skills/docs-audit/SKILL.md, regex: 'pytest test/ -q +# (\d+): all pass'}
    # README.md's table quotes it in a marker: <!-- fact:scheduler.test_count -->

- id: scheduler.test_modules
  kind: value
  title: pytest modules of the scheduler suite
  source: {glob: 'inference-scheduler/test/test_*.py', transform: 'len(v)'}
  fix: auto
  mentions:
    - {file: inference-scheduler/CLAUDE.md, regex: '(\d+) pytest modules'}
    - {file: doc/build-and-test/TESTING.md, regex: 'tests in (\d+) modules'}

- id: chat.test_count
  kind: value
  title: tests of the chat app (pytest and unittest collect the same)
  source:
    cmd: "{python} -m pytest demo/chat/tests --collect-only -q -p no:cacheprovider --color=no"
    parse: '(\d+) tests? collected'
    type: int
  watch: ['demo/chat/tests/test_*.py']
  fix: auto
  mentions:
    - {file: .claude/agents/run-tests.md, regex: 'demo/chat/tests` pytest \((\d+) tests'}
    - {file: .claude/agents/run-tests/baselines.json, regex: '"chat": \{[^}]*?"min_tests": (\d+)', dotall: true}
    - {file: .claude/skills/docs-audit/SKILL.md, regex: 'pytest demo/chat/tests -q +# (\d+)'}
    - {file: demo/chat/README.md, regex: 'unittest +# (\d+) tests'}
    - {file: demo/chat/doc/DEVELOPMENT.md, regex: 'unittest -v +# (\d+) tests'}
    - {file: doc/build-and-test/TESTING.md, regex: 'pytest demo/chat/tests -q +# (\d+) tests'}
    - {file: doc/build-and-test/TESTING.md, regex: 'the chat app \((\d+) tests\)'}
    # README.md's table: <!-- fact:chat.test_count -->

# ── the performance model ────────────────────────────────────────────────────
- id: perf.bitstream_id
  kind: value
  title: the bitstream the committed performance model is for
  source:
    glob: 'inference-scheduler/perf_models/kv260/*.json'
    transform: 'one(stem(p) for p in v if re.fullmatch(r"[0-9a-f]{12}\.json", basename(p)))'
  exists:                                    # the files a bitstream needs besides the model
    - 'inference-scheduler/perf_models/kv260/{fact:perf.bitstream_id}.cases.json'
    - 'inference-scheduler/perf_models/kv260/{fact:perf.bitstream_id}.calib.json'
    - '.claude/skills/perf-regression/baselines/kv260-{fact:perf.bitstream_id}.json'
  fix: report                                # a new bitstream rewrites these paragraphs by hand
  mentions:
    - {file: inference-scheduler/perf_models/README.md, regex: '^`kv260/([0-9a-f]{12})` is hw_128'}
    - {file: .claude/skills/perf-calibrate/SKILL.md, regex: 'Current model: \*\*kv260/([0-9a-f]{12})\*\*'}
    - {file: .claude/skills/perf-calibrate/SKILL.md, regex: 'print\(f\(\)\)" +# ([0-9a-f]{12}) today'}
    - {file: .claude/skills/perf-regression/SKILL.md, regex: 'echo \$BID +# ([0-9a-f]{12})'}
    - {file: .claude/skills/perf-regression/SKILL.md, regex: 'baselines/ +# kv260-([0-9a-f]{12})\.json'}
    - {file: .claude/skills/perf-regression/SKILL.md, regex: '^platform kv260, bitstream ([0-9a-f]{12})'}
  # dated records (TACTICS_PLAN §9, TTS_PLAN, LENET_PLAN) name the bitstream they were measured on: not mentions

- id: perf.model_size
  kind: value
  title: exact kernel calls of the performance model, host-model signatures and kinds
  source:
    parts:
      exact_calls: {file: 'inference-scheduler/perf_models/kv260/{fact:perf.bitstream_id}.json', json: exact, transform: 'len(v)'}
      host_signatures: {file: inference-scheduler/perf_models/kv260/host.json, json: exact, transform: 'len(v)'}
      host_kinds: {file: inference-scheduler/perf_models/kv260/host.json, json: kinds, transform: 'len(v)'}
  fix: report                                # the sentences carry dates: a top-up rewrites them
  mentions:
    - {file: inference-scheduler/perf_models/README.md, regex: '\): (?P<exact_calls>\d+) calls,'}
    - {file: .claude/skills/perf-calibrate/SKILL.md, dotall: true,
       regex: 'to (?P<exact_calls>\d+) exact calls, and `host.json` merged to (?P<host_signatures>\d+) signatures / (?P<host_kinds>\d+) kinds'}

# ── the scheduler CLI ────────────────────────────────────────────────────────
- id: cli.inference_scheduler
  kind: interface
  title: inference_scheduler.py's flags in its option lists
  check: cli_flags
  args:
    script: inference-scheduler/inference_scheduler.py
    cwd: inference-scheduler
    docs:
      - {file: inference-scheduler/CLAUDE.md, start: '^## CLI$', end: '^## '}
      - {file: inference-scheduler/doc/USER_GUIDE.md, start: '^### Options$', end: '^### '}

# ── kernel register maps ─────────────────────────────────────────────────────
# HLS s_axilite ports = the driver header = what the generated code, the
# benchmarks and the calibration runner write; the performance model keys on
# all of them except the not_keyed ones; the timeline decodes FIELDS only.
- id: registers.VectorOPKernel
  kind: interface
  title: VectorOPKernel AXI-Lite registers
  check: register_map
  args:
    kernel: VectorOPKernel
    prefix: XVectoropkernel
    hls: kernels/vectorop/kernel/VectorOP.cpp
    driver: 'build*/kernels/vectorop/kv260/*/*/impl/ip/drivers/VectorOPKernel_v1_0/src/xvectoropkernel_hw.h'
    not_keyed: {a: address, b: address, c: address}
    decode: inference-scheduler/src/timeline_html.py
    writers_all:
      - inference-scheduler/src/codegen/_source.py
      - inference-scheduler/bench_src/calib_runner.c
      - inference-scheduler/bench_src/bench_vectorop.c

- id: registers.MatmulKernel
  kind: interface
  title: MatmulKernel AXI-Lite registers
  check: register_map
  args:
    kernel: MatmulKernel
    prefix: XMatmulkernel
    hls: kernels/matmul/kernel/MatmulKernel.cpp
    driver: 'build*/kernels/matmul/kv260/*/*/impl/ip/drivers/MatmulKernel_v1_0/src/xmatmulkernel_hw.h'
    fields_alias: {a_stride: a_batch_stride, b_stride: b_batch_stride, c_stride: c_batch_stride}
    not_keyed: {a: address, b: address, c: address, a_to_b: "B's address relative to A (GEMV), no geometry"}
    decode: inference-scheduler/src/timeline_html.py
    writers_all:
      - inference-scheduler/src/codegen/_source.py
      - inference-scheduler/bench_src/calib_runner.c
      - inference-scheduler/bench_src/bench_matmul.c

- id: registers.ConvKernel
  kind: interface
  title: ConvKernel AXI-Lite registers
  check: register_map
  args:
    kernel: ConvKernel
    prefix: XConvkernel
    hls: kernels/conv/kernel/ConvKernel.cpp
    driver: 'build*/kernels/conv/kv260/*/*/impl/ip/drivers/ConvKernel_v1_0/src/xconvkernel_hw.h'
    fields_alias: {is_dw: is_depthwise}
    not_keyed: {x: address, y: address, weight: address, bias: address}
    decode: inference-scheduler/src/timeline_html.py
    writers_all:
      - inference-scheduler/src/codegen/_source.py
      - inference-scheduler/bench_src/calib_runner.c
      - inference-scheduler/bench_src/bench_conv.c

- id: registers.PoolKernel
  kind: interface
  title: PoolingKernel AXI-Lite registers
  check: register_map
  args:
    kernel: PoolKernel
    prefix: XPoolingkernel
    hls: kernels/pool/kernel/PoolingKernel.cpp
    driver: 'build*/kernels/pool/kv260/*/*/impl/ip/drivers/PoolingKernel_v1_0/src/xpoolingkernel_hw.h'
    not_keyed: {x: address, y: address}
    decode: inference-scheduler/src/timeline_html.py
    writers_all:
      - inference-scheduler/src/codegen/_source.py
      - inference-scheduler/bench_src/calib_runner.c
      - inference-scheduler/bench_src/bench_pool.c

- id: vectorop.codes
  kind: interface
  title: VectorOP op / act codes (the Op and Act enums) and their copies
  producer: {file: kernels/vectorop/include/VectorOP.h, regex: '^\s*((?:OP|ACT)_\w+)\s*=\s*(\d+)', as: dict}
  consumers:
    - {name: scheduler constants, file: inference-scheduler/src/nodes.py, regex: '^((?:OP|ACT)_\w+)\s*=\s*(\d+)', as: dict}
    - {name: CLAUDE.md operations table, file: CLAUDE.md, regex: '^\| (\d+) \| `(OP_\w+)`', as: dict, swap: true, keys: 'OP_*'}
    - {name: run_remote_perf._OP_NAMES, file: inference-scheduler/run_remote_perf.py, regex: '^_OP_NAMES = (\[.*\])',
       transform: "{'OP_' + n: i for i, n in enumerate(ast(v))}", keys: 'OP_*'}
    - {name: timeline DECODE, file: inference-scheduler/src/timeline_html.py,
       regex: 'VectorOPKernel: \{op: (\[[^\]]*\]), act: (\[[^\]]*\])',
       transform: "dict([('OP_' + n.upper(), i) for i, n in enumerate(ast(v[0]))] + [('ACT_' + n.upper(), i) for i, n in enumerate(ast(v[1]))])"}

# ── Python <-> C libraries ───────────────────────────────────────────────────
- id: ctypes.tts
  kind: interface
  title: the chat server's ctypes bindings of libpiper_tts.so and espeak-ng
  check: ctypes_bindings
  args:
    files: [demo/chat/piper_backend.py, demo/chat/piper_phonemize.py]
    external: [espeak_Initialize, espeak_SetVoiceByName, espeak_TextToPhonemes]   # libespeak-ng, no header here
    header: demo/tts/src/tts_api.h

- id: ctypes.llm
  kind: interface
  title: the chat server's ctypes bindings of the LLM, VLM, BERT and sampler libraries
  check: ctypes_bindings
  args:
    files: [demo/chat/smollm2_backend.py, demo/chat/smolvlm_backend.py, demo/chat/bert_squad_backend.py,
            demo/chat/sampler.py, demo/chat/scripts/llm_lib_check.py]
    header: demo/chat/src/llm_api.h

# ── configuration ────────────────────────────────────────────────────────────
- id: config.chat
  kind: interface
  title: chat_config.json.example against the code that reads it
  check: config_keys
  args:
    example: demo/chat/chat_config.json.example
    code: [demo/chat]
    waive:
      ssh.host: "ssh is null in the example: deploy.py takes it from bert_squad_config"
      ssh.port: "ssh is null in the example: deploy.py takes it from bert_squad_config"
      ssh.user: "ssh is null in the example: deploy.py takes it from bert_squad_config"
      local: "generate_llm_project.py reads local.driver_dirs from the BERT demo's config"
      remote.uio_devices: "llm_board.py / llm_attn_kernel_bench.py read the BERT demo's remote section"

# ── recorded: measured, with provenance ──────────────────────────────────────
- id: chat.pool_mib
  kind: recorded
  title: DMA pool of each chat model's library, MiB (what it takes of cma=1000M)
  value: {bert: 216, smollm2_135m: 286, smollm2_360m: 740, smolvlm_256m: 495}
  tolerance: 1                               # MiB: the docs round
  provenance:
    commit: 6c090cd
    date: 2026-10-02
    how: "facts.py verify: the generated projects in demo/chat/build and demo/bert_squad/build
          (BERT 215.3, 135M 285.8, 360M 740.3, SmolVLM 494.8 MiB)"
  depends_on:                                # what changes a pool's size
    - platforms/kv260.json
    - inference-scheduler/src/codegen/_core.py
    - inference-scheduler/src/codegen/multi.py
    - inference-scheduler/src/tensor.py
    - inference-scheduler/src/llm_entries.py
    - inference-scheduler/src/llama.py
    - inference-scheduler/src/vit.py
    - inference-scheduler/src/matmul_gemv.py
    - inference-scheduler/src/matmul_lowering.py
  verify:
    bert: {file: demo/bert_squad/build/project/report.md, regex: 'Pool size \(total incl\. weights\) \| [\d ]+ elem \(([\d.]+) MiB\)', type: float}
    smollm2_135m: {file: demo/chat/build/llm_project/include/inference.h, regex: 'INFERENCE_BUF_POOL_SIZE_BYTES\s+(\d+)u', transform: 'round(int(v) / 2**20, 1)'}
    smollm2_360m: {file: demo/chat/build/llm_project_smollm2_360m/include/inference.h, regex: 'INFERENCE_BUF_POOL_SIZE_BYTES\s+(\d+)u', transform: 'round(int(v) / 2**20, 1)'}
    smolvlm_256m: {file: demo/chat/build/llm_project_smolvlm_256m/include/inference.h, regex: 'INFERENCE_BUF_POOL_SIZE_BYTES\s+(\d+)u', transform: 'round(int(v) / 2**20, 1)'}
  fix: auto
  mentions:
    - {file: demo/chat/doc/DEPLOY.md, regex: '^\| BERT \| (?P<bert>\d+) MiB'}
    - {file: demo/chat/doc/DEPLOY.md, regex: '^\| SmolLM2-135M \| (?P<smollm2_135m>\d+) MiB'}
    - {file: demo/chat/doc/DEPLOY.md, regex: '^\| SmolLM2-360M \| (?P<smollm2_360m>\d+) MiB'}
    - {file: demo/chat/doc/DEPLOY.md, regex: '^\| SmolVLM-256M \| (?P<smolvlm_256m>\d+) MiB'}
    - {file: demo/chat/doc/SMOLLM2.md, regex: 'Its pool is (?P<smollm2_360m>\d+) MiB'}
    - {file: demo/chat/doc/SMOLLM2.md, regex: 'The pool buffer is (?P<smollm2_135m>\d+) MiB'}
    - {file: demo/chat/doc/SMOLVLM.md, regex: 'The SmolVLM pool is (?P<smolvlm_256m>\d+) MiB'}
    - {file: README.md, regex: 'prefill 2\.90 s, (?P<smollm2_360m>\d+) MiB CMA'}
    - {file: demo/chat/chat_config.json.example, regex: 'The (?P<smollm2_360m>\d+) MiB pool BO;'}
    - {file: demo/chat/chat_config.json.example, regex: 'The (?P<smolvlm_256m>\d+) MiB pool BO \+'}
    - {file: demo/chat/smolvlm_backend.py, regex: 'the (?P<smolvlm_256m>\d+) MiB pool BO'}
    - {file: demo/chat/deploy.py, regex: 'BERT pool BO needs ~(?P<bert>\d+) MiB'}
    - {file: .claude/skills/model-study/SKILL.md, dotall: true,
       regex: 'Pools served today: BERT (?P<bert>\d+), SmolLM2-135M\s+(?P<smollm2_135m>\d+), SmolLM2-360M (?P<smollm2_360m>\d+), SmolVLM (?P<smolvlm_256m>\d+) MiB'}
    - {file: .claude/skills/llm-onboard/SKILL.md, dotall: true,
       regex: 'Served pools: BERT (?P<bert>\d+), SmolLM2-135M (?P<smollm2_135m>\d+),\s+SmolLM2-360M (?P<smollm2_360m>\d+), SmolVLM (?P<smolvlm_256m>\d+) MiB'}

# ── what the scheduler accepts ───────────────────────────────────────────────
- id: scheduler.onnx_ops
  kind: interface
  title: the standard ONNX ops the scheduler accepts (graph._ALL_SUPPORTED_OP_TYPES) in the op lists of the docs
  check: names_in_docs
  args:
    names: {py: 'src.graph:sorted(_ALL_SUPPORTED_OP_TYPES)', cwd: inference-scheduler}
    docs:
      - file: inference-scheduler/doc/USER_GUIDE.md
        start: '^## 2\. Supported ONNX Operators'
        end: '^## 3\.'
        pattern: '`([A-Z][a-z]+(?:[A-Z][a-z0-9]*)*)\b'
        reverse: true
        extra_ok: [ReduceMean, Pow, Sqrt, Reciprocal, Tanh, Erf, SchedulerError]    # rejected unless fused; the error
      - {file: CLAUDE.md, start: '^\| Kernel \| ONNX ops \|', end: '^```', pattern: '\b([A-Z][A-Za-z0-9]*)\b'}
      - {file: doc/scheduler/INFERENCE_SCHEDULER.md, start: '^## Hardware Kernels', end: '^## ', pattern: '\b([A-Z][A-Za-z0-9]*)\b'}

- id: scheduler.axi_llm_ops
  kind: interface
  title: the custom-domain axi.llm ops (LLM / ViT / TTS op factories) in the docs that list them
  check: names_in_docs
  args:
    names: {py: 'src.graph:sorted({**LLM_OP_FACTORIES, **VIT_OP_FACTORIES, **TTS_OP_FACTORIES})', cwd: inference-scheduler}
    docs:
      - {file: CLAUDE.md, start: '^\| Kernel \| ONNX ops \|', end: '^```', pattern: '`((?:Llm|Vit|Tts)[A-Z][A-Za-z]*)`'}
      - file: doc/scheduler/INFERENCE_SCHEDULER.md      # the summary lists the host ops
        start: '^## Hardware Kernels'
        end: '^## '
        pattern: '`((?:Llm|Vit|Tts)[A-Z][A-Za-z]*)`'
        skip: [LlmAttnScores, LlmAttnPV]                  # ConvKernel calls, not host ops
      - file: doc/scheduler/INFERENCE_SCHEDULER.md      # the sections that define them
        start: '^### Llama-family decoders'
        end: '^### Multi-entry projects'
        pattern: '`((?:Llm|Vit|Tts)[A-Z][A-Za-z]*)`'
        reverse: true
        extra_ok: [LlmAttnConvNode, LlmNode, VitNode, TtsNode, LlmDecode]

- id: scheduler.event_kinds
  kind: interface
  title: the event-stream kinds (_compute_event_stream) and every consumer and list of them
  producer: {file: inference-scheduler/src/codegen/_core.py, regex: "events\\.append\\(\\('(\\w+)'", all: true,
             transform: 'dict.fromkeys(v, 1)'}
  consumers:
    - {name: the C emitter (_source._inference_function), file: inference-scheduler/src/codegen/_source.py,
       regex: "kind == '(\\w+)'", all: true, transform: 'dict.fromkeys(v, 1)'}
    - {name: liveness (_core._compute_live_intervals), file: inference-scheduler/src/codegen/_core.py,
       regex: "ev\\[0\\] in \\(([^)]*)\\)", all: true, exclude: [comment, reshape],
       transform: "dict.fromkeys(re.findall(r\"'(\\w+)'\", ' '.join(v)), 1)"}
    - {name: the timed replay (timing.simulate), file: inference-scheduler/src/codegen/timing.py,
       regex: 'kind (?:==|in) ([^:\n]+):', all: true, exclude: [comment, reshape],
       transform: "dict.fromkeys(re.findall(r'\"(\\w+)\"', ' '.join(v)), 1)"}
    - {name: inference-scheduler/CLAUDE.md, file: inference-scheduler/CLAUDE.md, regex: "^\\('(\\w+)',", all: true,
       transform: 'dict.fromkeys(v, 1)'}
    - {name: SCHEDULER_DAG.md, file: inference-scheduler/doc/SCHEDULER_DAG.md, regex: "^\\('(\\w+)',", all: true,
       transform: 'dict.fromkeys(v, 1)'}

- id: scheduler.file_thresholds
  kind: value
  title: when weights, expected outputs and host tables go to .dat files
  source:
    parts:
      weights: {py: 'src.tensor:LARGE_WEIGHT_THRESHOLD', cwd: inference-scheduler}
      expected: {py: 'src.codegen._simulate:LARGE_EXPECTED_THRESHOLD', cwd: inference-scheduler}
      table_kib: {py: 'src.llm_nodes:TABLE_FILE_BYTES // 1024', cwd: inference-scheduler}
  fix: auto
  mentions:
    - {file: inference-scheduler/CLAUDE.md, regex: 'weights > (?P<weights>\d+) elems, host tables > (?P<table_kib>\d+) KiB'}
    - {file: inference-scheduler/CLAUDE.md, regex: 'large GT expected arrays \(> (?P<expected>\d+) elems\)'}
    - {file: inference-scheduler/CLAUDE.md, regex: '`LARGE_WEIGHT_THRESHOLD = (?P<weights>\d+)`'}
    - {file: inference-scheduler/CLAUDE.md, regex: '`LARGE_EXPECTED_THRESHOLD = (?P<expected>\d+)`'}
    - {file: inference-scheduler/CLAUDE.md, regex: '`TABLE_FILE_BYTES = (?P<table_kib>\d+) KiB`'}
    - {file: inference-scheduler/doc/USER_GUIDE.md, regex: '^### Large Weights \(> (?P<weights>\d+) elements\)'}
    - {file: inference-scheduler/doc/USER_GUIDE.md, regex: '^Weight tensors exceeding (?P<weights>\d+) elements'}
    - {file: .claude/skills/add-host-op/SKILL.md, regex: 'Above `TABLE_FILE_BYTES` \((?P<table_kib>\d+) KiB\)'}
    - {file: doc/scheduler/INFERENCE_SCHEDULER.md, regex: '`weights/<name>\.dat` when > (?P<table_kib>\d+) KiB'}

# ── planning ─────────────────────────────────────────────────────────────────
- id: planning.thresholds
  kind: value
  title: --plan's minimum gain and the largest family error it trusts, in %
  source:
    parts:
      min_gain_pct: {py: 'src.matmul_lowering:round(PLAN_MIN_GAIN * 100, 3)', cwd: inference-scheduler}
      max_model_error_pct: {py: 'src.perf_model:round(MAX_MODEL_ERROR * 100, 3)', cwd: inference-scheduler}
  fix: auto
  mentions:
    - {file: doc/scheduler/INFERENCE_SCHEDULER.md, regex: 'at least (?P<min_gain_pct>[\d.]+) % below it \(`PLAN_MIN_GAIN`\)'}
    - {file: doc/scheduler/INFERENCE_SCHEDULER.md, regex: 'within (?P<max_model_error_pct>[\d.]+) % \(`MAX_MODEL_ERROR`\)'}
    - {file: .claude/skills/perf-calibrate/SKILL.md, regex: 'held-out p90 is at most (?P<max_model_error_pct>[\d.]+) %'}

- id: perf.shipped_models
  kind: value
  title: the models perf_calibrate.py measures (SHIPPED)
  source: {file: inference-scheduler/perf_calibrate.py, regex: '^SHIPPED = \((.*?)\)\n', dotall: true,
           transform: "len(ast('(' + v + ')'))"}
