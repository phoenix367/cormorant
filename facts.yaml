# ── the chat server's protocols ──────────────────────────────────────────────
- id: chat.http_routes
  kind: interface
  title: the chat server's HTTP routes (do_GET / do_POST) and the docs that name them
  producer:
    file: demo/chat/kv260_chat_server.py
    regex: 'def do_GET\(self\):(.*?)\n    def do_POST\(self\):(.*?)\n    def '
    dotall: true
    transform: >-
      dict.fromkeys(['GET ' + p for p in re.findall(r'path == "(/[^"]*)"', v[0])]
      + ['GET ' + p + '*' for p in re.findall(r'path\.startswith\("(/[^"]*)"\)', v[0])]
      + ['POST ' + p for p in re.findall(r'_path\(\) == "(/[^"]*)"', v[1])], 1)
  consumers:
    - {name: API.md, file: demo/chat/doc/API.md, regex: '`(GET|POST) (/[^`]+)`', all: true,
       transform: "dict.fromkeys([m + ' ' + re.sub(r'^/v1(?=/)', '', p).replace('{id}', '*') for m, p in v], 1)"}
    - {name: CLIENTS.md, file: demo/chat/doc/CLIENTS.md, regex: '`(GET|POST) (/[^`]+)`', all: true, subset: true,
       transform: "dict.fromkeys([m + ' ' + re.sub(r'^/v1(?=/)', '', p).replace('{id}', '*') for m, p in v], 1)"}
    - {name: DEPLOY.md, file: demo/chat/doc/DEPLOY.md, regex: '`(GET|POST) (/[^`]+)`', all: true, subset: true,
       transform: "dict.fromkeys([m + ' ' + re.sub(r'^/v1(?=/)', '', p).replace('{id}', '*') for m, p in v], 1)"}
    - {name: TEXT_TO_SPEECH.md, file: demo/chat/doc/TEXT_TO_SPEECH.md, regex: '`(GET|POST) (/[^`]+)`', all: true, subset: true,
       transform: "dict.fromkeys([m + ' ' + re.sub(r'^/v1(?=/)', '', p).replace('{id}', '*') for m, p in v], 1)"}
    - {name: chat README, file: demo/chat/README.md, regex: '`(GET|POST) (/[^`]+)`', all: true, subset: true,
       transform: "dict.fromkeys([m + ' ' + re.sub(r'^/v1(?=/)', '', p).replace('{id}', '*') for m, p in v], 1)"}
    - {name: tts README, file: demo/tts/README.md, regex: '`(GET|POST) (/[^`]+)`', all: true, subset: true,
       transform: "dict.fromkeys([m + ' ' + re.sub(r'^/v1(?=/)', '', p).replace('{id}', '*') for m, p in v], 1)"}

- id: cli.script_calls
  kind: interface
  title: the flags one script passes to another, against what the callee accepts
  check: script_flags
  args:
    pairs:
      - {caller: demo/chat/deploy.py, function: server_argv, callee: demo/chat/kv260_chat_server.py}
      - {caller: demo/chat/deploy.py, function: ensure_project, callee: demo/bert_squad/scripts/generate_project.py}
      - {caller: demo/chat/scripts/e2e_check.py, function: main, callee: [demo/chat/kv260_chat_server.py, demo/chat/chat.py]}
      - {caller: demo/chat/scripts/llm_calibrate.py, function: cmd_calibrate, callee: demo/chat/scripts/llm_study.py}
      - {caller: inference-scheduler/run_remote_tests.py, function: generate_project, callee: inference-scheduler/inference_scheduler.py}

- id: tts.max_ids
  kind: value
  title: Piper's encoder buckets; the largest is the chat server's packing size (piper_backend.MAX_IDS)
  source:
    parts:
      max_ids: {file: inference-scheduler/src/piper.py, regex: '^ENC_BUCKETS = (\([^)]*\))', transform: 'max(ast(v))'}
      buckets: {file: inference-scheduler/src/piper.py, regex: '^ENC_BUCKETS = (\([^)]*\))',
                transform: "', '.join(str(b) for b in ast(v))"}
  fix: report                                # code constants: change them by hand
  mentions:
    - {file: demo/chat/piper_backend.py, regex: '^MAX_IDS = (?P<max_ids>\d+)'}
    - {file: demo/chat/piper_backend.py, regex: 'sentence into utterances of <= (?P<max_ids>\d+) ids'}
    - {file: demo/chat/piper_phonemize.py, regex: 'max_ids: int = (?P<max_ids>\d+)\)'}
    - {file: demo/chat/doc/TEXT_TO_SPEECH.md, regex: 'utterances of at most (?P<max_ids>\d+) ids'}
    - {file: doc/scheduler/INFERENCE_SCHEDULER.md, regex: 'padded to T ∈ \{(?P<buckets>[\d, ]+)\}'}

