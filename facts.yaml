    - {file: .claude/skills/perf-regression/SKILL.md, regex: '^compared (?P<total>\d+) cases \(threshold'}
    - {file: .claude/skills/perf-regression/scripts/compare_perf.py, regex: '--json output \(the (?P<total>\d+) kernel cases\)'}
  # TESTING.md's and REMOTE_TESTING.md's sample outputs are dated runs

# ── the performance model ────────────────────────────────────────────────────
- id: perf.bitstream_id
  kind: value
  title: the bitstream of the current performance model (perf_models/README.md names it; a
    model of another bitstream may sit beside it, e.g. the last HLS MatmulKernel bitstream's)
  source:
    file: inference-scheduler/perf_models/README.md
    regex: '^`kv260/([0-9a-f]{12})` is '
  exists:                                    # the files a bitstream needs besides the model
    - 'inference-scheduler/perf_models/kv260/{fact:perf.bitstream_id}.cases.json'
    - 'inference-scheduler/perf_models/kv260/{fact:perf.bitstream_id}.calib.json'
    - '.claude/skills/perf-regression/baselines/kv260-{fact:perf.bitstream_id}.json'
  fix: report                                # a new bitstream rewrites these paragraphs by hand
  mentions:
    - {file: .claude/skills/perf-calibrate/SKILL.md, regex: 'Current model: \*\*kv260/([0-9a-f]{12})\*\*'}
    - {file: .claude/skills/perf-calibrate/SKILL.md, regex: 'print\(f\(\)\)" +# ([0-9a-f]{12}) today'}
    - {file: .claude/skills/perf-regression/SKILL.md, regex: 'echo \$BID +# ([0-9a-f]{12})'}
    - {file: .claude/skills/perf-regression/SKILL.md, regex: 'baselines/ +# kv260-([0-9a-f]{12})\.json'}
    - {file: .claude/skills/perf-regression/SKILL.md, regex: '^platform kv260, bitstream ([0-9a-f]{12})'}
    - {file: CLAUDE.md, regex: 'production `([0-9a-f]{12})` adds its softmax unit'}
    - {file: CLAUDE.md, regex: 'in the production bitstream `([0-9a-f]{12})` \(and'}
  # dated records (TACTICS_PLAN §9, TTS_PLAN, LENET_PLAN) name the bitstream they were measured on: not mentions

- id: perf.model_size
  kind: value
  title: exact kernel calls of the performance model, host-model signatures and kinds
  source:
    parts:
      exact_calls: {file: 'inference-scheduler/perf_models/kv260/{fact:perf.bitstream_id}.json', json: exact, transform: 'len(v)'}
      host_signatures: {file: inference-scheduler/perf_models/kv260/host.json, json: exact, transform: 'len(v)'}
      host_kinds: {file: inference-scheduler/perf_models/kv260/host.json, json: kinds, transform: 'len(v)'}
  fix: report                                # the sentences carry dates: a top-up rewrites them
  mentions:
    - {file: inference-scheduler/perf_models/README.md, regex: '\): (?P<exact_calls>\d+) calls,'}
    - {file: .claude/skills/perf-calibrate/SKILL.md, dotall: true,
       regex: 'to (?P<exact_calls>\d+) exact calls, and\s+`host.json` merged to (?P<host_signatures>\d+) signatures / (?P<host_kinds>\d+) kinds'}

# ── the engine cost model (src/cost_model.py; tools/fit_cost_model.py) ──────
- id: cost_model.call_overhead
  kind: value
  title: "the host's cost of one kernel call that the engine choice charges (CALL_OVERHEAD) = the call floor
    of the current performance model's campaign (its cheapest call, at its clock); the kernels' fixed costs
    ONE / one are fitted net of it (OFFLOAD_PLAN §4.3: 1500 against a ~315-cycle floor over-charged every call)"
  source:
    parts:
      cycles: {file: 'inference-scheduler/perf_models/kv260/{fact:perf.bitstream_id}.json', json: '',
               transform: "round(v['call_overhead_us'] * v['clock_mhz'])"}
      us: {file: 'inference-scheduler/perf_models/kv260/{fact:perf.bitstream_id}.json', json: call_overhead_us,
           transform: 'round(v, 2)'}
  fix: report                                # a code constant: refit with tools/fit_cost_model.py
  mentions:
    - {file: inference-scheduler/src/cost_model.py, regex: '^CALL_OVERHEAD\s+= (?P<cycles>\d+)$'}
    - {file: inference-scheduler/src/cost_model.py, regex: 'a 10-element VectorOP Add,\n# (?P<us>[\d.]+) us at \d+ MHz'}
    - {file: doc/scheduler/INFERENCE_SCHEDULER.md, regex: '`CALL_OVERHEAD` \((?P<cycles>\d+) cycles: the cheapest measured call'}

- id: cost_model.board_fit
  kind: recorded
  title: the engine cost model's per-call error against the board (RTL_CONV_BOARD, RTL_COEF + CALL_OVERHEAD;
    median / p90 %) on the campaign it was fitted to, quoted in the code and the docs that describe the model
  value: {conv_calls: 1190, conv_median: 18.3, conv_p90: 45.8, matmul_calls: 414, matmul_median: 4.5, matmul_p90: 17.7}
  provenance:
    date: 2026-10-07
    how: "tools/fit_cost_model.py fit --shipped-weight 0.75 --decisions D (the decision-aware set: no shipped
          model's engine choice moves; OFFLOAD_PLAN §4.3) on the campaign of 6436623029f7 as of 1729 exact calls;
          the constants as used before (100 MHz, + 1500): ConvKernel 33.9 / 64.5 %, MatmulKernel 8.8 / 29.6 %;
          the plain refit 14.5 / 44.2 % (it moved BERT's P·V to MatmulKernel).  Re-scored on 588d721997cb
          (SOFTMAX_PLAN, 2026-10-07; the kernels' cycles unchanged) and kept: `fit 588d721997cb` gives the
          constants as used ConvKernel 18.7 / 48.2 % over 1265 calls, MatmulKernel 4.6 / 17.7 % over 414 (its
          proposal 15.1 / 45.1 %, not taken: the shipped libraries stay as gated); CALL_OVERHEAD 448 -> 434 with
          ONE / one +14, so no decision moves"
    facts: {perf.bitstream_id: 588d721997cb}  # a new bitstream: a new campaign, refit or re-score
  fix: report
  mentions:
    - {file: inference-scheduler/src/cost_model.py,
       regex: 'at 250 MHz, (?P<conv_calls>[\d ]+) calls, median (?P<conv_median>[\d.]+) %,\n# p90 (?P<conv_p90>[\d.]+) %'}
    - {file: inference-scheduler/src/cost_model.py,
       regex: 'at 250 MHz, (?P<matmul_calls>\d+) calls:\n# median (?P<matmul_median>[\d.]+) %, p90 (?P<matmul_p90>[\d.]+) %'}
    - {file: doc/scheduler/INFERENCE_SCHEDULER.md, dotall: true,
       regex: 'x and weight runs; median (?P<conv_median>[\d.]+) %, p90 (?P<conv_p90>[\d.]+) % over the\s+(?P<conv_calls>[\d ]+) ConvKernel calls'}
    - {file: doc/kernels/CONV_RTL_KERNEL.md, dotall: true,
       regex: '`[0-9a-f]{12}`, median (?P<conv_median>[\d.]+) %, p90 (?P<conv_p90>[\d.]+) %'}
    - {file: .claude/skills/conv-cycle-model/SKILL.md, dotall: true,
       regex: '[0-9a-f]{12}: median (?P<conv_median>[\d.]+) %, p90 (?P<conv_p90>[\d.]+) %;'}
  # OFFLOAD_PLAN §4.3's table is the dated record of this fit

- id: cost_model.conv_anchors
  kind: value
  title: the board anchors test_rtl_conv_model pins conv_board_cycles to (cycles net of the call floor) and
    the model's estimate of BERT's per-head P·V, as INFERENCE_SCHEDULER.md quotes them
  source:
    parts:
      big_board: {file: inference-scheduler/test/test_matmul_on_conv.py,
                  regex: '(?s)def test_rtl_conv_model.*?conv_board_cycles\(\*\*big\)\["total"\] / (\d+) - 1\)', type: int}
      pv_board: {file: inference-scheduler/test/test_matmul_on_conv.py,
                 regex: '(?s)def test_rtl_conv_model.*?conv_board_cycles\(\*\*pv\)\["total"\] / (\d+) - 1\)', type: int}
      pv_board_ms: {file: inference-scheduler/test/test_matmul_on_conv.py,
                    regex: '(?s)def test_rtl_conv_model.*?conv_board_cycles\(\*\*pv\)\["total"\] / (\d+) - 1\)',
                    transform: 'round(int(v) / 250e3, 2)'}
      pv_model: {py: 'src.cost_model:round(conv_board_cycles(in_ch=256, out_ch=256, in_h=1, in_w=64, oh=1, ow=64, kh=1, kw=1)["total"])',
                 cwd: inference-scheduler}
  fix: report
  mentions:
    - {file: inference-scheduler/test/test_matmul_on_conv.py, regex: 'testbench, (?P<big_board>[\d ]+) on the board \(grid-bound\)'}
    - {file: inference-scheduler/test/test_matmul_on_conv.py, regex: 'channels, 64 pixels\) (?P<pv_board>[\d ]+) on the board'}
    - {file: doc/scheduler/INFERENCE_SCHEDULER.md, dotall: true,
       regex: 'per-head attention P·V conv: (?P<pv_board>[\d ]+) cycles on the\s+board \((?P<pv_board_ms>[\d.]+) ms at 250 MHz\), (?P<pv_model>[\d ]+) predicted'}

# ── the scheduler CLI ────────────────────────────────────────────────────────
- id: cli.inference_scheduler
  kind: interface
  title: inference_scheduler.py's flags in its option lists
  check: cli_flags
  args:
    script: inference-scheduler/inference_scheduler.py
    cwd: inference-scheduler
    docs:
      - {file: inference-scheduler/CLAUDE.md, start: '^## CLI$', end: '^## '}
      - {file: inference-scheduler/doc/USER_GUIDE.md, start: '^### Options$', end: '^### '}

# ── kernel register maps ─────────────────────────────────────────────────────
# HLS s_axilite ports = the driver header = what the generated code, the
# benchmarks and the calibration runner write; the performance model keys on
# all of them except the not_keyed ones; the timeline decodes FIELDS only.
- id: registers.VectorOPKernel
  kind: interface
  title: VectorOPKernel AXI-Lite registers
