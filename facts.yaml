                transform: 'round(int(v) * 256 / 22050, 2)'}       # HOP 256, the voice's 22 050 Hz
  fix: auto
  mentions:
    - {file: README.md, regex: 'one fixed-size chunk \((?P<out_frames>\d+) frames, (?P<seconds>[\d.]+) s of audio\)'}
    - {file: README.md, regex: '\*\*0\.7 s\*\* per (?P<seconds>[\d.]+) s of audio'}
    - {file: CLAUDE.md, regex: '(?P<out_frames>\d+) frames = (?P<seconds>[\d.]+) s of audio per pass'}
    - {file: demo/chat/doc/TEXT_TO_SPEECH.md, regex: 'chunks of (?P<out_frames>\d+) frames \((?P<seconds>[\d.]+) s of speech\)'}
    - {file: demo/tts/README.md, regex: 'about 0\.7 s per (?P<seconds>[\d.]+) s chunk'}
    - {file: demo/tts/README.md, regex: 'FPGA, per chunk of (?P<out_frames>\d+) frames'}       # the mermaid diagram
    - {file: doc/scheduler/INFERENCE_SCHEDULER.md, regex: 'pcm, (?P<dec_frames>\d+) × 256 int16 samples'}

# ── build and test entry points ─────────────────────────────────────────────
- id: build.make_targets
  kind: interface
  title: the make targets the README and CLAUDE.md name exist (make help of a configured build/)
  optional: true                             # needs a configured build/
  check: names_in_docs
  args:
    names: {cmd: "make -C build help", transform: "re.findall(r'^\\.\\.\\. (\\S+)', v, re.M)"}
    missing: no make target of build/
    docs:
      - {file: README.md, start: '^## Quick start', end: '^## Supported models', forward: false, reverse: true,
         pattern: '\b(Test[A-Z]\w*|synthesize_\w+|build_hw_\w+|dtbo_\w+|behavior_test\w*|sim_hw_\w+|gen_\w+_test_data)\b'}
      - {file: CLAUDE.md, start: '^## Build System', end: '^## Architecture', forward: false, reverse: true,
         pattern: '\bmake +(\w+)'}

- id: tests.suites
  kind: value
  title: the run-tests helper's suite sets (run_tests.py DEFAULT / ALL)
  source:
    parts:
      default: {file: .claude/agents/run-tests/run_tests.py, regex: '^DEFAULT = (\([^)]*\))', transform: "', '.join(ast(v))"}
      all: {file: .claude/agents/run-tests/run_tests.py, regex: '^ALL = (\([^)]*\))', transform: "', '.join(ast(v))"}
  fix: auto
  mentions:
    - {file: README.md, regex: '--suite all` \((?P<all>[\w, -]+)\)'}
    - {file: CLAUDE.md, regex: '--suite all +# (?P<all>[\w, -]+)$'}
    - {file: .claude/agents/run-tests.md, regex: '^\| `default` \| (?P<default>[\w, -]+) \|'}
    - {file: .claude/agents/run-tests.md, regex: '^\| `all` \| (?P<all>[\w, -]+) \(not rtl\)'}
    - {file: .claude/agents/run-tests/run_tests.py, regex: 'default: (?P<default>[\w,-]+)\):', format: "v.replace(', ', ',')"}
    - {file: .claude/agents/run-tests/run_tests.py, regex: '^  all +(?P<all>[\w,-]+) \(not rtl\)', format: "v.replace(', ', ',')"}

- id: toolchain.vivado
  kind: value
  title: the Vitis / Vivado release the design is built with (the hw project's version)
  optional: true                             # the hw/ submodule
  source: {file: hw/cormorant_hw_128/cormorant_hw_128.xpr, regex: 'Product Version: Vivado v(\d{4}\.\d)'}
  fix: auto
  mentions:
    - {file: README.md, regex: '<Xilinx>/(\d{4}\.\d)/Vitis/settings64\.sh'}
    - {file: CLAUDE.md, regex: '(?:\*\*Xilinx Vitis |/mnt/data/xilinx/)(\d{4}\.\d)'}
    - {file: CMakeLists.txt, regex: 'submodule and Vivado (\d{4}\.\d)\.'}
    - {file: .claude/agents/run-tests/run_tests.py, regex: 'xilinx/(\d{4}\.\d)/Vitis'}
    - {file: doc/build-and-test/BUILD_TARGETS.md, regex: '(?:\*\*Vitis |<Xilinx>/|xilinx/|Requires Vivado )(\d{4}\.\d)'}
    - {file: doc/build-and-test/TESTING.md, regex: '<Xilinx>/(\d{4}\.\d)/Vitis'}
    - {file: inference-scheduler/doc/REMOTE_TESTING.md, regex: '(?:<Xilinx>|/opt/Xilinx)/(\d{4}\.\d)/Vitis'}
    - {file: .claude/skills/board-deploy/SKILL.md, regex: 'xilinx/(\d{4}\.\d)/Vitis'}
    - {file: .claude/skills/docs-audit/SKILL.md, regex: 'xilinx/(\d{4}\.\d)/Vitis'}
    - {file: .claude/skills/kernel-verify/SKILL.md, regex: 'xilinx/(\d{4}\.\d)/Vitis'}
    - {file: .claude/skills/docs-audit/templates/new_user_brief.md, regex: 'Vitis / Vivado (\d{4}\.\d)'}

# ── the chat client, the voice samples, the demo video ──────────────────────
- id: cli.chat_client
  kind: interface
  title: chat.py's flags in its own usage synopsis (the module docstring)
  check: cli_flags
  args:
    script: demo/chat/chat.py
    cwd: demo/chat
    docs:
      - {file: demo/chat/chat.py, start: '^  chat\.py ', end: '^$', pattern: '(--[a-z0-9][a-z0-9-]*)'}

- id: chat.banner_columns
  kind: value
  title: the narrowest terminal chat.py draws its banner in (the logo's width + 3)
  source: {py: 'chat:len(LOGO[0]) + 3', cwd: demo/chat}
  fix: auto
  mentions:
    - {file: demo/chat/doc/CLIENTS.md, regex: 'terminal narrower than (\d+) columns'}
    - {file: demo/chat/chat.py, regex: 'terminal narrower\s+than (\d+) columns'}

- id: tts.sample_lengths
  kind: value
  title: the voice samples' lengths (demo/tts/samples/manifest.json) in the TTS README's table
  source: {file: demo/tts/samples/manifest.json, json: samples, transform: "{k: s['seconds'] for k, s in v.items()}"}
  fix: auto
  mentions:
    - {file: demo/tts/README.md, regex: '\(samples/hello\.mp3\) \| ".*?" \| (?P<hello>[\d.]+) s \|', format: "f'{v + 1e-6:.1f}'"}   # half up
    - {file: demo/tts/README.md, regex: '\(samples/paragraph\.mp3\) \| ".*?" \| (?P<paragraph>[\d.]+) s \|', format: "f'{v + 1e-6:.1f}'"}   # half up
    - {file: demo/tts/README.md, regex: '\(samples/question\.mp3\) \| ".*?" \| (?P<question>[\d.]+) s \|', format: "f'{v + 1e-6:.1f}'"}   # half up
    - {file: demo/tts/README.md, regex: '\(samples/fast\.mp3\) \| .*? \| (?P<fast>[\d.]+) s \|', format: "f'{v + 1e-6:.1f}'"}   # half up

- id: tts.sample_links
  kind: interface
  title: every voice sample a doc links to exists; the TTS README lists them all
  check: names_in_docs
  args:
    names: {glob: 'demo/tts/samples/*.mp3', transform: '[basename(p) for p in v]'}
    missing: no file in demo/tts/samples/
    docs:
      - {file: demo/tts/README.md, start: '^## Samples', end: '^## Files', pattern: 'samples/(\w+\.mp3)', reverse: true}
      - {file: demo/chat/doc/TEXT_TO_SPEECH.md, start: '^# Text to speech', end: '^## Install', pattern: 'samples/(\w+\.mp3)',
         forward: false, reverse: true}
      - {file: demo/chat/README.md, start: '^# KV260 chat server', pattern: 'tts/samples/(\w+\.mp3)', forward: false, reverse: true}
      - {file: README.md, start: '^## Results on the board', end: '^## Hardware kernels', pattern: 'samples/(\w+\.mp3)',
         forward: false, reverse: true}

- id: docs.demo_video
  kind: value
  title: "the demo video's link: set here, then `facts.py fix docs.demo_video` rewrites every copy"
  source: "https://youtu.be/VVS7ExW0XYQ"
  fix: auto
  mentions:
    - {file: README.md, regex: '(https://youtu\.be/[\w-]+)', count: 3}
    - {file: demo/README.md, regex: '\[demo video\]\((https://youtu\.be/[\w-]+)\)'}
    - {file: demo/chat/README.md, regex: '\[Demo video\]\((https://youtu\.be/[\w-]+)\)'}
    - {file: demo/chat/doc/SMOLLM2.md, regex: '\[This video\]\((https://youtu\.be/[\w-]+)\)'}
