  title: LightStereo-S's disparity quality on the 42 Middlebury / ETH3D pairs, the board against float on the same input
  value: {epe: 0.667, bad1: 12.21, bad2: 4.94, float_epe: 0.650, float_bad1: 11.81, float_bad2: 4.87, sim_epe: 0.627}
  tolerance: 0.006                           # the docs round to two or three places
  provenance:
    date: 2026-10-09
    how: "STEREO_PLAN §4.2-§4.3: the board run (run_demo.py --pairs 0, 640 x 480, per_channel 0.05, bitstream
          8599aa7a5f12) EPE 0.6672 / bad-1 12.21 / bad-2 4.94; float on the same fitted input (stereo_study.py study
          --fit 480 640) 0.6500 / 11.81 / 4.87; the simulated graph at native resolution (sim_quality.py --pc 0.05)
          EPE 0.627 (float 0.633); the board run of 2026-10-12 on 1cedaf2ed816 (44 pairs) gives the same EPE 0.667 /
          12.21 / 4.94, bit-exact with the simulation"
    facts: {perf.bitstream_id: 1cedaf2ed816}   # the datapath is bit-exact with the simulation on any bitstream with the softmax unit
  verify:
    epe: {file: demo/stereo_depth/build/results.json, json: '', transform: "one(x['metrics']['epe'] for x in v if x['name'] == 'lightstereo_s')"}
    bad1: {file: demo/stereo_depth/build/results.json, json: '', transform: "one(x['metrics']['bad1'] for x in v if x['name'] == 'lightstereo_s')"}
    bad2: {file: demo/stereo_depth/build/results.json, json: '', transform: "one(x['metrics']['bad2'] for x in v if x['name'] == 'lightstereo_s')"}
    float_epe: {file: demo/stereo_depth/assets/study/study_anything-s_fit640.json, json: summary.all.float.epe}
    float_bad1: {file: demo/stereo_depth/assets/study/study_anything-s_fit640.json, json: summary.all.float.bad1}
    float_bad2: {file: demo/stereo_depth/assets/study/study_anything-s_fit640.json, json: summary.all.float.bad2}
    sim_epe: {file: demo/stereo_depth/assets/study/sim_quality_pc5_final.json, json: summary.all.epe}
  fix: report
  mentions:
    - {file: README.md, regex: 'EPE (?P<epe>[\d.]+) px on 42 Middlebury / ETH3D pairs \(float (?P<float_epe>[\d.]+) on the same input\)'}
    - {file: demo/README.md, regex: 'EPE (?P<epe>[\d.]+) px on 42 pairs against float.s (?P<float_epe>[\d.]+) on the same input'}
    - {file: doc/README.md, regex: 'EPE (?P<epe>[\d.]+) px \(float (?P<float_epe>[\d.]+) on the same\s+input\)'}
    - {file: demo/stereo_depth/README.md, regex: '^\| float on the same input \(`stereo_study\.py study --fit 480 640`\) \| (?P<float_epe>[\d.]+) \| (?P<float_bad1>[\d.]+) % \| (?P<float_bad2>[\d.]+) % \|'}
    - {file: demo/stereo_depth/README.md, regex: '^\| \*\*FPGA\*\* \| \*\*(?P<epe>[\d.]+)\*\* \| \*\*(?P<bad1>[\d.]+) %\*\* \| \*\*(?P<bad2>[\d.]+) %\*\* \|'}
    - {file: demo/stereo_depth/README.md, regex: 'simulation of the graph scores EPE\s+(?P<sim_epe>[\d.]+) px'}
    - {file: doc/plans/STEREO_PLAN.md, dotall: true,
       regex: 'EPE (?P<epe>[\d.]+) px and bad-2\s+(?P<bad2>[\d.]+) %, against float.s (?P<float_epe>[\d.]+) / (?P<float_bad2>[\d.]+) % on the same scaled input'}
    - {file: doc/plans/STEREO_PLAN.md, regex: '\| \*\*(?P<epe>[\d.]+)\*\* \| (?P<bad1>[\d.]+) % \| \*\*(?P<bad2>[\d.]+) %\*\* \| (?P<float_epe>[\d.]+) / (?P<float_bad1>[\d.]+) % / (?P<float_bad2>[\d.]+) % \|'}

- id: stereo.realsense
  kind: recorded
  title: LightStereo-S on RealSense D435 pairs taken on the board - latency per pair and how its depth (fx * baseline / disparity) agrees with the camera's own (median relative difference and share of pixels within 10 %, IR projector on / off)
  value: {ms: 657, on_median: 2.4, on_within10: 97.9, off_median: 4.3, off_within10: 76.7}
  tolerance: {rel: 0.03}                     # the docs round ("98 %")
  provenance:
    date: 2026-10-09
    how: "STEREO_PLAN §4.4: run_demo.py --capture on the board (bitstream 8599aa7a5f12; the D435 on firmware
          5.17.3.10 over USB 2), two 640 x 480 pairs with the projector on and off, maps bit-exact against the
          simulation; postprocess.realsense_depth compares where both depths exist (296 632 / 151 667 px).  The
          run's results.json is kept as demo/stereo_depth/build/results_realsense.json"
    facts: {perf.bitstream_id: 8599aa7a5f12}
  verify:
    ms: {file: demo/stereo_depth/build/results_realsense.json, json: '',
         transform: "one(x['metrics']['mean_ms'] for x in v if x['name'] == 'lightstereo_s')"}
    on_median: {file: demo/stereo_depth/build/results_realsense.json, json: '',
                transform: "one(100 * p['realsense']['median_rel_diff'] for x in v if x['name'] == 'lightstereo_s' for p in x['per_pair'] if p['name'] == 'realsense_emitter-on')"}
    on_within10: {file: demo/stereo_depth/build/results_realsense.json, json: '',
                  transform: "one(p['realsense']['within_10pct'] for x in v if x['name'] == 'lightstereo_s' for p in x['per_pair'] if p['name'] == 'realsense_emitter-on')"}
    off_median: {file: demo/stereo_depth/build/results_realsense.json, json: '',
                 transform: "one(100 * p['realsense']['median_rel_diff'] for x in v if x['name'] == 'lightstereo_s' for p in x['per_pair'] if p['name'] == 'realsense_emitter-off')"}
    off_within10: {file: demo/stereo_depth/build/results_realsense.json, json: '',
                   transform: "one(p['realsense']['within_10pct'] for x in v if x['name'] == 'lightstereo_s' for p in x['per_pair'] if p['name'] == 'realsense_emitter-off')"}
  fix: report
  mentions:
    - {file: README.md, regex: 'RealSense D435 pairs taken on the board: depth within 10 % of the camera.s own on (?P<on_within10>\d+) % of the pixels'}
    - {file: demo/README.md, regex: 'RealSense pairs: depth within 10 % of the camera.s own on (?P<on_within10>\d+) % of the pixels'}
    - {file: doc/README.md, regex: 'RealSense D435 on the board \(§4\.4\): depth within 10 % of the camera.s own on (?P<on_within10>\d+) % of the pixels'}
    - {file: demo/stereo_depth/README.md,
       regex: 'a D435 pair took (?P<ms>\d+) ms(?: \([^)]*\))?; with the IR\s+projector on, the network.s depth is within 10 % of the camera.s own on\s+(?P<on_within10>\d+) % of the pixels \(median difference (?P<on_median>[\d.]+) %\), without it on (?P<off_within10>\d+) % \((?P<off_median>[\d.]+) %\)'}
    - {file: doc/plans/STEREO_PLAN.md, regex: 'Both ran in (?P<ms>\d+) ms per pair'}
    - {file: doc/plans/STEREO_PLAN.md, regex: '^\| projector on \| [\d ]+ \| (?P<on_median>[\d.]+) % \| [\d.]+ % \| (?P<on_within10>[\d.]+) % \|'}
    - {file: doc/plans/STEREO_PLAN.md, regex: '^\| projector off \(passive\) \| [\d ]+ \| (?P<off_median>[\d.]+) % \| [\d.]+ % \| (?P<off_within10>[\d.]+) % \|'}

