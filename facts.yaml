    - {file: inference-scheduler/CLAUDE.md, regex: 'downloads bertsquad-12, (\d+) MB,'}
    - {file: inference-scheduler/doc/USER_GUIDE.md, regex: 'downloads the (\d+) MB'}
    - {file: .claude/agents/run-tests.md, regex: 'downloads the (\d+) MB (?:BERT|bertsquad)'}
    - {file: doc/build-and-test/TESTING.md, regex: '(?:downloads the |fetch_assets\.py`: |\n   )(\d+) MB'}
    - {file: demo/chat/README.md, regex: 'BERT model \((\d+) MB\)'}
    - {file: demo/chat/doc/BERT_QA.md, regex: 'The model \((\d+) MB\)'}
    - {file: demo/chat/doc/DEPLOY.md, regex: 'fetches the model \((\d+) MB\)'}
    - {file: .github/workflows/inference-scheduler-tests.yml, regex: 'bertsquad-12 \((\d+) MB'}
    - {file: inference-scheduler/test/test_bert_base.py, regex: '(?:real |Google Drive, )(\d+) MB'}

- id: bert.engine_split
  kind: value
  title: BERT-base's MatMuls on each kernel and its ConvKernel calls (test_bert_base.py asserts them;
    the RTL MatmulKernel and the board-priced ConvKernel decide it)
  source:
    parts:
      matmuls: {file: inference-scheduler/test/test_bert_base.py,
                regex: 'k\[MatmulNode\] \+ k\[MatmulConvNode\], k\[ScheduledNode\]\), \((\d+),', type: int}
      on_conv: {file: inference-scheduler/test/test_bert_base.py, regex: 'assertEqual\(k\[MatmulConvNode\], (\d+)\)', type: int}
      on_matmul: {file: inference-scheduler/test/test_bert_base.py, dotall: true,
                  regex: 'k\[ScheduledNode\]\), \((\d+), \d+\).*?assertEqual\(k\[MatmulConvNode\], (\d+)\)',
                  transform: 'int(v[0]) - int(v[1])'}
      conv_calls: {file: inference-scheduler/test/test_bert_base.py,
                   regex: 'matmul_conv_stats\["conv_calls"\], (\d+) \+ (\d+) \* (\d+)\)',
                   transform: 'int(v[0]) + int(v[1]) * int(v[2])'}
  fix: auto
  mentions:
    - {file: doc/scheduler/INFERENCE_SCHEDULER.md,
       regex: 'bertsquad-12, 386 nodes\): (?P<on_conv>\d+) of the (?P<matmuls>\d+) MatMuls run on ConvKernel'}
    - {file: doc/scheduler/INFERENCE_SCHEDULER.md, regex: '^(?P<conv_calls>\d+) ConvKernel calls; the K = 2 token-type'}
    - {file: doc/scheduler/INFERENCE_SCHEDULER.md,
       regex: 'CLI defaults — (?P<on_conv>\d+) MatMuls on\s+ConvKernel, (?P<on_matmul>\d+) on MatmulKernel'}
    - {file: demo/bert_squad/README.md, regex: 'uses\) (?P<on_conv>\d+) of the (?P<matmuls>\d+)\s+MatMuls run on ConvKernel'}
    - {file: demo/bert_squad/scripts/generate_project.py,
       regex: 'ConvKernel — (?P<on_conv>\d+) of the (?P<matmuls>\d+) MatMuls, BERT_PLAN 2A — and\s+MatmulKernel for the (?P<on_matmul>\d+) that stay'}
    - {file: demo/bert_squad/bert_squad_config.json.example, regex: 'ConvKernel runs (?P<on_conv>\d+) of its (?P<matmuls>\d+) MatMuls'}
  # BERT_PLAN's phase results (96 of 98 in 360 calls, …) are dated

- id: chat.limits
  kind: value
  title: the chat models' context and the speech endpoint's input limit
  source:
    parts:
      context: {file: demo/chat/scripts/llm_project.py, regex: '^CONTEXT = (\d+)', type: int}
      speech_chars: {file: demo/chat/kv260_chat_server.py, regex: '^MAX_SPEECH_INPUT = (\d+)', type: int}
  fix: auto
  mentions:
    - {file: README.md, regex: 'context (?P<context>\d+) \|', count: 3}
    - {file: README.md, regex: 'up to (?P<speech_chars>\d+) characters'}
    - {file: demo/chat/doc/TEXT_TO_SPEECH.md, regex: 'the text, up to (?P<speech_chars>\d+) characters'}
    - {file: demo/chat/chat_config.json.example, regex: '"context": (?P<context>\d+),', fix: report}

- id: piper.chunk
  kind: value
  title: "Piper's chunk (piper.py) — valid frames, decoder frames, seconds of audio at 22 050 Hz"
  source:
    parts:
      out_frames: {file: inference-scheduler/src/piper.py, regex: '^FLOW_FRAMES, DEC_FRAMES, OUT_FRAMES = (\d+), (\d+), (\d+)', transform: 'int(v[2])'}
      dec_frames: {file: inference-scheduler/src/piper.py, regex: '^FLOW_FRAMES, DEC_FRAMES, OUT_FRAMES = (\d+), (\d+), (\d+)', transform: 'int(v[1])'}
      seconds: {file: inference-scheduler/src/piper.py, regex: '^FLOW_FRAMES, DEC_FRAMES, OUT_FRAMES = \d+, \d+, (\d+)',
                transform: 'round(int(v) * 256 / 22050, 2)'}       # HOP 256, the voice's 22 050 Hz
  fix: auto
  mentions:
    - {file: README.md, regex: 'one fixed-size chunk \((?P<out_frames>\d+) frames, (?P<seconds>[\d.]+) s of audio\)'}
    - {file: README.md, regex: '\*\*[\d.]+ s\*\* per (?P<seconds>[\d.]+) s of audio'}
    - {file: CLAUDE.md, regex: '(?P<out_frames>\d+) frames = (?P<seconds>[\d.]+) s of audio per pass'}
    - {file: demo/chat/doc/TEXT_TO_SPEECH.md, regex: 'chunks of (?P<out_frames>\d+) frames \((?P<seconds>[\d.]+) s of speech\)'}
    - {file: demo/tts/README.md, regex: 'about 0\.7 s per (?P<seconds>[\d.]+) s chunk'}
    - {file: demo/tts/README.md, regex: 'FPGA, per chunk of (?P<out_frames>\d+) frames'}       # the mermaid diagram
    - {file: doc/scheduler/INFERENCE_SCHEDULER.md, regex: 'pcm, (?P<dec_frames>\d+) × 256 int16 samples'}

- id: vlm.vision_gelu
  kind: value
  title: SmolVLM's vision GELUs on VectorOPKernel's activation unit (VitGeluVopNode, OFFLOAD_PLAN §2.1) and
    its layers, from the generated project (a layer whose GELU output has a channel off 2^-8 stays on the host)
  optional: true                             # demo/chat/build: generate_llm_project.py --model-name smolvlm-256m-instruct
  source:
    parts:
      on_vop: {file: demo/chat/build/llm_project_smolvlm_256m/src/inference.c,
               regex: "(on VectorOPKernel's activation unit): ADD bias", all: true, transform: 'len(v)'}
      layers: {file: demo/chat/build/llm_project_smolvlm_256m/src/inference.c,
               regex: '/\* \[\d+\] (VitGelu)\(vision', all: true, transform: 'len(v)'}
  fix: report
  mentions:
    - {file: CLAUDE.md, regex: '(?P<on_vop>\d+) of (?P<layers>\d+) layers, `doc/plans/OFFLOAD_PLAN\.md` §2\.1'}
    - {file: doc/scheduler/INFERENCE_SCHEDULER.md, dotall: true, regex: '\((?P<on_vop>\d+) of SmolVLM.s (?P<layers>\d+)\s+layers\)'}
    - {file: doc/plans/OFFLOAD_PLAN.md, regex: 'for every channel \((?P<on_vop>\d+) of the (?P<layers>\d+) layers;'}

- id: piper.vop_sums
  kind: value
  title: "Piper's chunk: the TtsSums on VectorOPKernel (TtsAddVopNode) and on the host, from the generated project,
    and the decoder's stage exponents that make them exact (piper.vop_exponents; OFFLOAD_PLAN §2.2)"
  optional: true                             # demo/tts/build, demo/tts/assets: generate_tts_project.py
  source:
    parts:
      vop: {file: demo/tts/build/piper_project/src/inference.c, regex: '(VectorOPKernel ADD) \*/', all: true,
            transform: 'len(v)'}
      host: {file: demo/tts/build/piper_project/src/inference.c,
             regex: '\] (TtsSum)\([^\n]*host CPU, no hardware call', all: true, transform: 'len(v)'}
      stage_exp: {py: "src.piper:' / '.join(str(vop_exponents(json.load(open('../demo/tts/assets/piper-lessac-medium/exponents.json'))['exponents'])[f'dec.up{i}']) for i in range(3))",
                  cwd: inference-scheduler}
  fix: report
  mentions:
    - {file: doc/plans/OFFLOAD_PLAN.md, regex: 'smallest calibrated one \((?P<stage_exp>[\d /]+):'}
    - {file: doc/plans/OFFLOAD_PLAN.md, regex: 'saturated\) first, so each sum has two inputs\.  (?P<vop>\d+) `TtsSum`'}
    - {file: doc/plans/OFFLOAD_PLAN.md, dotall: true,
       regex: 'the chunk graph has (?P<vop>\d+) `TtsAddVopNode` \(18 residual sums,\s+3 tap-group sums\) and (?P<host>\d+) host `TtsSum`'}
    - {file: inference-scheduler/test/test_piper.py, regex: 'assertGreaterEqual\(kinds\.pop\("TtsAddVopNode"\), (?P<vop>\d+)\)'}

# ── build and test entry points ─────────────────────────────────────────────
- id: build.make_targets
  kind: interface
  title: the make targets the README and CLAUDE.md name exist (make help of a configured build/)
  optional: true                             # needs a configured build/
  check: names_in_docs
  args:
    names: {cmd: "make -C build help", transform: "re.findall(r'^\\.\\.\\. (\\S+)', v, re.M)"}
    missing: no make target of build/
    docs:
      - {file: README.md, start: '^## Quick start', end: '^## Supported models', forward: false, reverse: true,
         pattern: '\b(Test[A-Z]\w*|synthesize_\w+|build_hw_\w+|dtbo_\w+|behavior_test\w*|sim_hw_\w+|gen_\w+_test_data)\b'}
      - {file: CLAUDE.md, start: '^## Build System', end: '^## Architecture', forward: false, reverse: true,
         pattern: '\bmake +(\w+)'}

- id: tests.suites
  kind: value
  title: the run-tests helper's suite sets (run_tests.py DEFAULT / ALL)
  source:
    parts:
      default: {file: .claude/agents/run-tests/run_tests.py, regex: '^DEFAULT = (\([^)]*\))', transform: "', '.join(ast(v))"}
      all: {file: .claude/agents/run-tests/run_tests.py, regex: '^ALL = (\([^)]*\))', transform: "', '.join(ast(v))"}
  fix: auto
  mentions:
    - {file: README.md, regex: '--suite all` \((?P<all>[\w, -]+)\)'}
    - {file: CLAUDE.md, regex: '--suite all +# (?P<all>[\w, -]+)$'}
    - {file: .claude/agents/run-tests.md, regex: '^\| `default` \| (?P<default>[\w, -]+) \|'}
    - {file: .claude/agents/run-tests.md, regex: '^\| `all` \| (?P<all>[\w, -]+) \(not rtl\)'}
    - {file: .claude/agents/run-tests/run_tests.py, regex: 'default: (?P<default>[\w,-]+)\):', format: "v.replace(', ', ',')"}
    - {file: .claude/agents/run-tests/run_tests.py, regex: '^  all +(?P<all>[\w,-]+) \(not rtl\)', format: "v.replace(', ', ',')"}

- id: toolchain.vivado
