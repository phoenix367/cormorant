# facts.yaml — facts that code and docs state in several places: where each
# one is true (source / producer / provenance) and every place that repeats it
# (mentions / consumers).  Checked by tools/facts/facts.py (format and
# workflow: tools/facts/README.md):
#
#   python3 tools/facts/facts.py check            # all facts; exit 1 on a failure
#   python3 tools/facts/facts.py fix              # rewrite stale `fix: auto` mentions
#   python3 tools/facts/facts.py changed          # the facts a change touches + files to review
#   python3 tools/facts/facts.py impact PATH|ID   # what a file is part of / what a fact ties together
#
# Kinds: value (derived from the code), interface (components that must
# agree), recorded (measured; value + provenance, stale when its inputs change).
# Regex locators: Python syntax, multiline; group 1 (or named groups for a
# mapping value) is the quoted text.  Markers in prose:
# <!-- fact:ID -->VALUE<!-- /fact --> (or fact:ID.KEY) are found anywhere.

python: inference-scheduler/.venv/bin/python     # runs `py:` sources and {python} in commands

facts:

# ── test counts ──────────────────────────────────────────────────────────────
- id: scheduler.test_count
  kind: value
  title: tests the scheduler suite collects
  source:
    cmd: "{python} -m pytest test/ --collect-only -q -p no:cacheprovider --color=no"
    cwd: inference-scheduler
    parse: '(\d+) tests? collected'
    type: int
  watch: ['inference-scheduler/test/test_*.py']
  fix: auto
  mentions:
    - {file: CLAUDE.md, regex: 'Run all tests \((\d+) tests'}
    - {file: inference-scheduler/CLAUDE.md, regex: 'pytest modules, (\d+) tests'}
    - {file: doc/scheduler/INFERENCE_SCHEDULER.md, regex: 'Run the full test suite \((\d+) tests'}
    - {file: inference-scheduler/doc/USER_GUIDE.md, regex: 'Run the full test suite \((\d+) tests'}
    - {file: doc/build-and-test/TESTING.md, regex: 'Run all (\d+) tests in \d+ modules'}
    - {file: doc/build-and-test/TESTING.md, regex: 'planning \((\d+) tests\)'}
    - {file: README.md, regex: 'pytest test/ -q +# (\d+) tests'}
    - {file: .claude/agents/run-tests.md, regex: 'pytest `test/` \((\d+) tests'}
    - {file: .claude/agents/run-tests/baselines.json, regex: '"scheduler": \{[^}]*?"min_tests": (\d+)', dotall: true}
    - {file: .claude/skills/docs-audit/SKILL.md, regex: 'pytest test/ -q +# (\d+): all pass'}
    # README.md's table quotes it in a marker: <!-- fact:scheduler.test_count -->

- id: scheduler.test_modules
  kind: value
  title: pytest modules of the scheduler suite
  source: {glob: 'inference-scheduler/test/test_*.py', transform: 'len(v)'}
  fix: auto
  mentions:
    - {file: inference-scheduler/CLAUDE.md, regex: '(\d+) pytest modules'}
    - {file: doc/build-and-test/TESTING.md, regex: 'tests in (\d+) modules'}

- id: chat.test_count
  kind: value
  title: tests of the chat app (pytest and unittest collect the same)
  source:
    cmd: "{python} -m pytest demo/chat/tests --collect-only -q -p no:cacheprovider --color=no"
    parse: '(\d+) tests? collected'
    type: int
  watch: ['demo/chat/tests/test_*.py']
  fix: auto
  mentions:
    - {file: .claude/agents/run-tests.md, regex: 'demo/chat/tests` pytest \((\d+) tests'}
    - {file: .claude/agents/run-tests/baselines.json, regex: '"chat": \{[^}]*?"min_tests": (\d+)', dotall: true}
    - {file: .claude/skills/docs-audit/SKILL.md, regex: 'pytest demo/chat/tests -q +# (\d+)'}
    - {file: demo/chat/README.md, regex: 'unittest +# (\d+) tests'}
    - {file: demo/chat/doc/DEVELOPMENT.md, regex: 'unittest -v +# (\d+) tests'}
    - {file: doc/build-and-test/TESTING.md, regex: 'pytest demo/chat/tests -q +# (\d+) tests'}
    - {file: doc/build-and-test/TESTING.md, regex: 'the chat app \((\d+) tests\)'}
    # README.md's table: <!-- fact:chat.test_count -->

# ── RTL fixtures, simulations and kernel benchmarks ──────────────────────────
- id: fixtures.rtl
  kind: value
  title: the checked-in RTL fixtures (hw/test_data manifests) the behaviour tests and TestMatmulRtl run
  source:
    parts:
      vecop: {file: hw/test_data/vecop_test_data/manifest.txt, regex: '^(\d+) ', all: true, transform: 'len(v)'}
      conv: {file: hw/test_data/conv_test_data/manifest.txt, regex: '^(\d+) ', all: true, transform: 'len(v)'}
      matmul: {file: hw/test_data/matmul_test_data/manifest.txt, regex: '^(\d+) ', all: true, transform: 'len(v)'}
      matmul_gemv: {file: hw/test_data/matmul_test_data/manifest.txt,    # gemv_kw column > 0
                    regex: '^(?:\d+ ){8}([1-9]\d*) ', all: true, transform: 'len(v)'}
      matmul_tiled: {file: hw/test_data/matmul_test_data/manifest.txt, regex: '^(?:\d+ ){8}(0) ', all: true, transform: 'len(v)'}
      pool: {file: hw/test_data/pool_test_data/manifest.txt, regex: '^(\d+) ', all: true, transform: 'len(v)'}
      rowops: {file: hw/test_data/rowops_test_data/manifest.txt, regex: '^(\d+) ', all: true, transform: 'len(v)'}
  fix: auto
  mentions:
    - {file: .claude/skills/kernel-verify/SKILL.md, regex: '`hw/test_data/conv_test_data/` \((?P<conv>\d+) cases\)'}
    - {file: .claude/skills/kernel-verify/SKILL.md, regex: '\[ck\] ConvKernel: PASS  \((?P<conv>\d+)/\d+\)'}
    - {file: .claude/skills/kernel-verify/SKILL.md, regex: '`TestConvRtl` runs the (?P<conv>\d+) checked-in fixtures'}
    - {file: .claude/skills/kernel-verify/SKILL.md,
       regex: 'matmul_test_data/` \((?P<matmul>\d+) cases, (?P<matmul_gemv>\d+) GEMV\) \| `hw/test_data/vecop_test_data/` \((?P<vecop>\d+) cases\)'}
    - {file: .claude/skills/kernel-verify/SKILL.md, regex: '`TestMatmulRtl` runs the (?P<matmul>\d+) checked-in fixtures'}
    - {file: .claude/skills/kernel-verify/SKILL.md, regex: '\[ck\] MatmulKernel: PASS  \((?P<matmul>\d+)/\d+\)'}
    - {file: .claude/skills/kernel-verify/SKILL.md, regex: '`VectorOPKernel … total=(?P<vecop>\d+) passed='}
    - {file: .claude/skills/kernel-verify/SKILL.md, regex: '\[ck\] PoolingKernel: PASS  \((?P<pool>\d+)/\d+\)'}
    - {file: doc/build-and-test/BUILD_TARGETS.md, regex: 'CTest test runs the (?P<matmul>\d+) checked-in fixtures'}
    - {file: doc/build-and-test/BUILD_TARGETS.md,
       regex: 'pass \((?P<vecop>\d+) VectorOP, (?P<conv>\d+) Conv, (?P<matmul>\d+) Matmul \((?P<matmul_gemv>\d+) GEMV\), (?P<pool>\d+) Pool cases\)'}
    - {file: doc/build-and-test/TESTING.md, regex: 'runs the (?P<matmul>\d+) checked-in MatmulKernel fixtures'}
    - {file: doc/build-and-test/TESTING.md, regex: 'runs the (?P<rowops>\d+) checked-in RowOps fixtures'}
    - {file: doc/build-and-test/BUILD_TARGETS.md, regex: 'runs the (?P<rowops>\d+) checked-in RowOps fixtures'}
    - {file: doc/kernels/ROWOPS_RTL_KERNEL.md, regex: 'rowops_test_data/` \((?P<rowops>\d+) cases'}
    - {file: CLAUDE.md, regex: '`TestRowOpsRtl`: the (?P<rowops>\d+) fixtures'}
    - {file: doc/build-and-test/TESTING.md,
       regex: 'manifests currently hold (?P<vecop>\d+) VectorOP, (?P<conv>\d+) Conv, (?P<matmul>\d+) Matmul \((?P<matmul_gemv>\d+) of them GEMV\) and (?P<pool>\d+) Pool'}
    - {file: doc/build-and-test/TESTING.md, regex: 'VectorOP Test Summary: (?P<vecop>\d+) / (?P<vecop__d>\d+) passed'}
    - {file: doc/kernels/CONV_KERNEL.md, regex: '; (?P<conv>\d+) RTL fixtures\)'}
    - {file: doc/kernels/POOLING_KERNEL.md, regex: '`make behavior_test_pool`\) runs the same (?P<pool>\d+)'}
    - {file: doc/kernels/MATMUL_RTL_KERNEL.md, regex: 'matmul behaviour test\s+\((?P<matmul>\d+) / (?P<matmul__d>\d+)\)'}
    - {file: doc/kernels/MATMUL_RTL_KERNEL.md, regex: 'TestMatmulRtl: (?P<matmul>\d+) fixtures \+'}
    - {file: doc/kernels/MATMUL_RTL_KERNEL.md,
       regex: 'All (?P<matmul>\d+) HLS-oracle fixtures .*?: (?P<matmul_tiled>\d+) tiled plus (?P<matmul_gemv>\d+) GEMV-image cases'}
    - {file: doc/kernels/MATMUL_RTL_KERNEL.md, regex: 'It passes (?P<matmul>\d+) of \d+ fixtures'}
    - {file: hw/cormorant_test_stand/README.md, regex: 'kernel=ConvKernel  total=(?P<conv>\d+)'}
