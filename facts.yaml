# ── the board: UIO devices of the overlay ────────────────────────────────────
- id: board.uio_labels
  kind: interface
  title: the overlay's UIO names (dts/kv260/cormorant.dts) in the configs and docs
  producer: {file: dts/kv260/cormorant.dts, regex: '^\s*(fabric_\w+): fabric_\w+@', all: true, transform: 'dict.fromkeys(v, 1)'}
  consumers:
    - {name: remote_config example, file: inference-scheduler/remote_config.json.example, json: remote.uio_devices,
       transform: "dict.fromkeys([x for k, x in v.items() if not k.startswith('_')], 1)"}
    - {name: perf_config example, file: inference-scheduler/perf_config.json.example, json: remote.uio_devices,
       transform: "dict.fromkeys([x for k, x in v.items() if not k.startswith('_')], 1)"}
    - {name: the README, file: README.md, regex: 'uio\*/name +→ +.*?\), (fabric_\w+(?: fabric_\w+)*)$', transform: 'dict.fromkeys(v.split(), 1)'}
    - {name: perf-calibrate skill, file: .claude/skills/perf-calibrate/SKILL.md, regex: 'It must list `(fabric_[\w ]+)`', transform: 'dict.fromkeys(v.split(), 1)'}
    - {name: the MNIST README, file: demo/mnist/README.md, regex: '# → (fabric_\w+(?:, fabric_\w+)*)$', transform: "dict.fromkeys(v.split(', '), 1)"}

- id: board.uio_map
  kind: interface
  title: which UIO device each kernel uses, in every example config and doc table
  producer: {file: inference-scheduler/remote_config.json.example, json: remote.uio_devices,
             transform: "{k.replace('PoolingKernel', 'PoolKernel'): x for k, x in v.items() if not k.startswith('_')}"}
  consumers:
    - {name: perf_config example, file: inference-scheduler/perf_config.json.example, json: remote.uio_devices,
       transform: "{k.replace('PoolingKernel', 'PoolKernel'): x for k, x in v.items() if not k.startswith('_')}"}
    - {name: BERT demo config, file: demo/bert_squad/bert_squad_config.json.example, json: remote.uio_devices, subset: true,
       transform: "{k.replace('PoolingKernel', 'PoolKernel'): x for k, x in v.items() if not k.startswith('_')}"}
    - {name: camera demo config, file: demo/camera/camera_config.json.example, json: remote.uio_devices, subset: true,
       transform: "{k.replace('PoolingKernel', 'PoolKernel'): x for k, x in v.items() if not k.startswith('_')}"}
    - {name: image demo config, file: demo/image_classification/image_classification_config.json.example, json: remote.uio_devices, subset: true,
       transform: "{k.replace('PoolingKernel', 'PoolKernel'): x for k, x in v.items() if not k.startswith('_')}"}
    - {name: object detection demo config, file: demo/object_detection/object_detection_config.json.example, json: remote.uio_devices, subset: true,
       transform: "{k.replace('PoolingKernel', 'PoolKernel'): x for k, x in v.items() if not k.startswith('_')}"}
    - {name: stereo depth demo config, file: demo/stereo_depth/stereo_depth_config.json.example, json: remote.uio_devices, subset: true,
       transform: "{k.replace('PoolingKernel', 'PoolKernel'): x for k, x in v.items() if not k.startswith('_')}"}
    - {name: MNIST demo config, file: demo/mnist/mnist_config.json.example, json: remote.uio_devices, subset: true,
       transform: "{k.replace('PoolingKernel', 'PoolKernel'): x for k, x in v.items() if not k.startswith('_')}"}
    - {name: REMOTE_TESTING table, file: inference-scheduler/doc/REMOTE_TESTING.md, regex: '^\| `(\w+Kernel)` +\| `(fabric_\w+)` +\| `fabric_\w+` +\|',
       as: dict, transform: "{k.replace('PoolingKernel', 'PoolKernel'): x for k, x in v.items()}"}
    - {name: TESTING table, file: doc/build-and-test/TESTING.md, regex: '^\| `(\w+Kernel)` \| `(fabric_\w+)` \|$',
       as: dict, transform: "{k.replace('PoolingKernel', 'PoolKernel'): x for k, x in v.items()}"}

- id: board.irq_spi
  kind: interface
  title: each kernel's interrupt (SPI) — the block design's pl_ps_irq0 bit n is SPI 89 + n (UG1085 PL-to-PS group 0,
    GIC ids 121–128) — in the Linux overlay's UIO nodes and the architecture document
  optional: true                             # the hw/ submodule
  producer: {file: hw/cormorant_hw_128/cormorant_hw_128.srcs/sources_1/bd/design_cormorant/design_cormorant.bd,
             json: design.nets,
             transform: "{n[:-len('_0_interrupt')]: 89 + [int(p.split('/In')[1]) for p in x['ports'] if p.startswith('ilconcat_0/In')][0]
                          for n, x in v.items() if n.endswith('_0_interrupt')}"}
  consumers:
    - {name: the Linux overlay, file: dts/kv260/cormorant.dts, as: dict,
       regex: '^\s*fabric_(\w+): fabric_\w+@[0-9a-f]+ \{\s*interrupts = <0x00 (0x[0-9a-f]+) 0x04>;',
       transform: "{ {'vecop': 'VectorOPKernel', 'matmul': 'MatmulKernel', 'conv': 'ConvKernel', 'pool': 'PoolingKernel',
                      'rowops': 'RowOpsKernel'}[k]: int(x, 16) for k, x in v.items()}"}
    - {name: ARCHITECTURE interrupt table, file: doc/ARCHITECTURE.md, as: dict,
       regex: '^\| (\w+Kernel) \| \d \| (\d+) \| \d+ \|'}

# ── assets, limits, the chunk ────────────────────────────────────────────────
- id: bert.model_mb
