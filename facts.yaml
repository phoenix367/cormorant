           transform: "round(int(v.replace('_', '')) / 1e6)"}
  fix: auto
  mentions:
    - {file: README.md, regex: 'downloads the (\d+) MB BERT model'}
    - {file: CLAUDE.md, regex: 'downloads bertsquad-12 — (\d+) MB —'}
    - {file: inference-scheduler/CLAUDE.md, regex: 'downloads bertsquad-12, (\d+) MB,'}
    - {file: inference-scheduler/doc/USER_GUIDE.md, regex: 'downloads the (\d+) MB'}
    - {file: .claude/agents/run-tests.md, regex: 'downloads the (\d+) MB (?:BERT|bertsquad)'}
    - {file: doc/build-and-test/TESTING.md, regex: '(?:downloads the |fetch_assets\.py`: |\n   )(\d+) MB'}
    - {file: demo/chat/README.md, regex: 'BERT model \((\d+) MB\)'}
    - {file: demo/chat/doc/BERT_QA.md, regex: 'The model \((\d+) MB\)'}
    - {file: demo/chat/doc/DEPLOY.md, regex: 'fetches the model \((\d+) MB\)'}
