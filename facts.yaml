       regex: '\| VectorOP \| (?P<vecop>\d+) \|.*\n\| Matmul \| (?P<matmul>\d+) \((?P<matmul_gemv>\d+) GEMV\) \|.*\n\| Conv \| (?P<conv>\d+) \|.*\n\| Pool \| (?P<pool>\d+) \|.*\n\| RowOps \| (?P<rowops>\d+) \|'}
  # dated records (kernel-verify's measured runs, MATMUL_RTL_PLAN, optimisation logs) keep their counts

- id: matmul_rtl.random_cases
  kind: value
  title: the random cases TestMatmulRtl runs after the fixtures (MM_RTL_RANDOM_CASES)
  source: {file: kernels/matmul_rtl/CMakeLists.txt, regex: 'set\(MM_RTL_RANDOM_CASES (\d+) CACHE', type: int}
  fix: auto
  mentions:
    - {file: kernels/matmul_rtl/CMakeLists.txt, regex: '^#\s+fixtures \+ (\d+) random cases'}
    - {file: doc/build-and-test/BUILD_TARGETS.md, regex: 'checked-in fixtures \+ (\d+) random cases'}
    - {file: doc/build-and-test/TESTING.md, regex: 'ref_matmul_2d` — plus (\d+) random'}
    - {file: doc/kernels/MATMUL_RTL_KERNEL.md, regex: 'TestMatmulRtl: \d+ fixtures \+ (\d+) random cases'}
    - {file: doc/kernels/MATMUL_RTL_KERNEL.md, regex: 'ctest runs them plus (\d+) random cases'}
    - {file: .claude/skills/kernel-verify/SKILL.md, regex: '^  (\d+) random cases \(seed 1\)'}

- id: sim_hw.cases
  kind: value
  title: the cases of the whole-design simulation (sim_hw_kv260, hw/cormorant_hw_128 sim_1 testbench)
  source:
    parts:
      vectorop: {file: hw/cormorant_hw_128/cormorant_hw_128.srcs/sim_1/new/vop_classes.svh, regex: '(tests\.push_back)', all: true, transform: 'len(v)'}
      conv: {file: hw/cormorant_hw_128/cormorant_hw_128.srcs/sim_1/new/conv_classes.svh, regex: '(tests\.push_back)', all: true, transform: 'len(v)'}
      matmul: {file: hw/cormorant_hw_128/cormorant_hw_128.srcs/sim_1/new/mm_classes.svh, regex: '(tests\.push_back)', all: true, transform: 'len(v)'}
      pool: {file: hw/cormorant_hw_128/cormorant_hw_128.srcs/sim_1/new/pk_classes.svh, regex: '(tests\.push_back)', all: true, transform: 'len(v)'}
      # the RowOps cases are the checked-in fixtures (ro_classes.svh reads the manifest) plus the table load
      rowops: {file: hw/test_data/rowops_test_data/manifest.txt, regex: '^(\d+) ', all: true, transform: 'len(v) + 1'}
      total: {cmd: "echo $(( $(cat hw/cormorant_hw_128/cormorant_hw_128.srcs/sim_1/new/*_classes.svh | grep -c 'tests\\.push_back') + $(grep -c '^[0-9]' hw/test_data/rowops_test_data/manifest.txt) + 1 ))",
              parse: '(\d+)', type: int}
  fix: auto
  mentions:
    - {file: .claude/skills/kernel-verify/SKILL.md, regex: 'Pass: `##  TOTAL: (?P<total>\d+) / (?P<total__d>\d+) passed`'}
    - {file: .claude/skills/kernel-verify/SKILL.md,
       regex: '\(VectorOPKernel (?P<vectorop>\d+), ConvKernel (?P<conv>\d+), MatmulKernel (?P<matmul>\d+), PoolingKernel (?P<pool>\d+), RowOpsKernel (?P<rowops>\d+)\)'}
    - {file: doc/build-and-test/BUILD_TARGETS.md, regex: 'block-design testbench, (?P<total>\d+) cases over the five kernels'}
    - {file: doc/ARCHITECTURE.md, regex: 'and the row-ops fixtures, (?P<total>\d+) cases'}
    - {file: doc/kernels/MATMUL_RTL_KERNEL.md, regex: 'whole-design simulation \((?P<total>\d+) / (?P<total__d>\d+)\)'}
    - {file: doc/kernels/MATMUL_RTL_KERNEL.md, regex: 'with this IP passes (?P<total>\d+) / (?P<total__d>\d+) \(Matmul (?P<matmul>\d+) / (?P<matmul__d>\d+)\)'}
    - {file: hw/cormorant_hw_128/README.md, regex: '~4 minutes \((?P<total>\d+) cases: the four kernels'' constant-fill cases and the RowOpsKernel''s (?P<rowops>\d+)'}
    # the sample output of TESTING.md §3, hw_128 CLAUDE.md and README.md
    - {file: doc/build-and-test/TESTING.md, regex: &sim_hw_out '##        VectorOPKernel +(?P<vectorop>\d+) / +(?P<vectorop__d>\d+) .*\n##            ConvKernel +(?P<conv>\d+) / +(?P<conv__d>\d+) .*\n##          MatmulKernel +(?P<matmul>\d+) / +(?P<matmul__d>\d+) .*\n##         PoolingKernel +(?P<pool>\d+) / +(?P<pool__d>\d+) .*\n##          RowOpsKernel +(?P<rowops>\d+) / +(?P<rowops__d>\d+) .*\n.*\n##  TOTAL: (?P<total>\d+) / (?P<total__d>\d+) passed'}
    - {file: hw/cormorant_hw_128/CLAUDE.md, regex: *sim_hw_out}
    - {file: hw/cormorant_hw_128/README.md, regex: *sim_hw_out}

- id: perf.case_count
  kind: value
  title: the kernel benchmarks of perf_config.json.example (run_remote_perf.py, the perf-regression baseline)
  source:
    parts:
      vectorop: {file: inference-scheduler/perf_config.json.example, json: benchmarks.VectorOPKernel.cases, transform: 'len(v)'}
      matmul: {file: inference-scheduler/perf_config.json.example, json: benchmarks.MatmulKernel.cases, transform: 'len(v)'}
      conv: {file: inference-scheduler/perf_config.json.example, json: benchmarks.ConvKernel.cases, transform: 'len(v)'}
      pool: {file: inference-scheduler/perf_config.json.example, json: benchmarks.PoolingKernel.cases, transform: 'len(v)'}
      rowops: {file: inference-scheduler/perf_config.json.example, json: benchmarks.RowOpsKernel.cases, transform: 'len(v)'}
      total: {file: inference-scheduler/perf_config.json.example, json: benchmarks,
              transform: "sum(len(x['cases']) for x in v.values() if isinstance(x, dict))"}
  fix: auto
  mentions:
    - {file: inference-scheduler/CLAUDE.md, regex: '`perf_config\.json\.example` \((?P<total>\d+) cases\)'}
    - {file: doc/build-and-test/TESTING.md, dotall: true,
       regex: 'ships with \*\*(?P<total>\d+) benchmark cases\*\*\s+across the five kernels \((?P<vectorop>\d+) VectorOPKernel, (?P<matmul>\d+) MatmulKernel'}
    - {file: doc/build-and-test/TESTING.md, regex: '§8b — (?P<conv>\d+) ConvKernel, (?P<pool>\d+) PoolingKernel, (?P<rowops>\d+) RowOpsKernel:'}
    - {file: inference-scheduler/doc/REMOTE_TESTING.md, regex: 'Performance benchmarks — (?P<total>\d+) cases;'}
    - {file: .claude/skills/perf-regression/SKILL.md, regex: 'say whether anything regressed — the (?P<total>\d+) kernel benchmarks'}
    - {file: .claude/skills/perf-regression/SKILL.md, regex: 'OVERALL: All (?P<total>\d+) cases passed ──` \('}
    - {file: .claude/skills/perf-regression/SKILL.md, regex: '^compared (?P<total>\d+) cases \(threshold'}
    - {file: .claude/skills/perf-regression/scripts/compare_perf.py, regex: '--json output \(the (?P<total>\d+) kernel cases\)'}
  # TESTING.md's and REMOTE_TESTING.md's sample outputs are dated runs

# ── the performance model ────────────────────────────────────────────────────
- id: perf.bitstream_id
  kind: value
  title: the bitstream of the current performance model (perf_models/README.md names it; a
    model of another bitstream may sit beside it, e.g. the last HLS MatmulKernel bitstream's)
  source:
    file: inference-scheduler/perf_models/README.md
    regex: '^`kv260/([0-9a-f]{12})` is '
  exists:                                    # the files a bitstream needs besides the model
    - 'inference-scheduler/perf_models/kv260/{fact:perf.bitstream_id}.cases.json'
    - 'inference-scheduler/perf_models/kv260/{fact:perf.bitstream_id}.calib.json'
    - '.claude/skills/perf-regression/baselines/kv260-{fact:perf.bitstream_id}.json'
  fix: report                                # a new bitstream rewrites these paragraphs by hand
  mentions:
    - {file: .claude/skills/perf-calibrate/SKILL.md, regex: 'Current model: \*\*kv260/([0-9a-f]{12})\*\*'}
    - {file: .claude/skills/perf-calibrate/SKILL.md, regex: 'print\(f\(\)\)" +# ([0-9a-f]{12}) today'}
    - {file: .claude/skills/perf-regression/SKILL.md, regex: 'echo \$BID +# ([0-9a-f]{12})'}
    - {file: .claude/skills/perf-regression/SKILL.md, regex: 'baselines/ +# kv260-([0-9a-f]{12})\.json'}
    - {file: .claude/skills/perf-regression/SKILL.md, regex: '^platform kv260, bitstream ([0-9a-f]{12})'}
    - {file: CLAUDE.md, regex: 'production `([0-9a-f]{12})` adds the RowOpsKernel'}
    - {file: CLAUDE.md, regex: 'in the production bitstream `([0-9a-f]{12})` \(and'}
  # dated records (TACTICS_PLAN §9, TTS_PLAN, LENET_PLAN) name the bitstream they were measured on: not mentions

- id: perf.model_size
  kind: value
  title: exact kernel calls of the performance model, host-model signatures and kinds
  source:
    parts:
      exact_calls: {file: 'inference-scheduler/perf_models/kv260/{fact:perf.bitstream_id}.json', json: exact, transform: 'len(v)'}
      host_signatures: {file: inference-scheduler/perf_models/kv260/host.json, json: exact, transform: 'len(v)'}
      host_kinds: {file: inference-scheduler/perf_models/kv260/host.json, json: kinds, transform: 'len(v)'}
  fix: report                                # the sentences carry dates: a top-up rewrites them
  mentions:
    - {file: inference-scheduler/perf_models/README.md, regex: '→\s+\*\*(?P<exact_calls>\d+) exact calls\*\*'}
    - {file: .claude/skills/perf-calibrate/SKILL.md, dotall: true,
       regex: '\+58, \+179\) → (?P<exact_calls>\d+) exact calls'}

# ── the engine cost model (src/cost_model.py; tools/fit_cost_model.py) ──────
- id: cost_model.call_overhead
  kind: value
  title: "the host's cost of one kernel call that the engine choice charges (CALL_OVERHEAD) = the call floor
    of the current performance model's campaign (its cheapest call, at its clock); the kernels' fixed costs
    ONE / one are fitted net of it (OFFLOAD_PLAN §4.3: 1500 against a ~315-cycle floor over-charged every call)"
  source:
    parts:
      cycles: {file: 'inference-scheduler/perf_models/kv260/{fact:perf.bitstream_id}.json', json: '',
               transform: "round(v['call_overhead_us'] * v['clock_mhz'])"}
      us: {file: 'inference-scheduler/perf_models/kv260/{fact:perf.bitstream_id}.json', json: call_overhead_us,
           transform: 'round(v, 2)'}
  fix: report                                # a code constant: refit with tools/fit_cost_model.py
  mentions:
    - {file: inference-scheduler/src/cost_model.py, regex: '^CALL_OVERHEAD\s+= (?P<cycles>\d+)$'}
    - {file: inference-scheduler/src/cost_model.py, regex: 'a 10-element VectorOP Add,\n# (?P<us>[\d.]+) us at \d+ MHz'}
    - {file: doc/scheduler/INFERENCE_SCHEDULER.md, regex: '`CALL_OVERHEAD` \((?P<cycles>\d+) cycles: the cheapest measured call'}

- id: cost_model.board_fit
  kind: recorded
  title: the engine cost model's per-call error against the board (RTL_CONV_BOARD, RTL_COEF + CALL_OVERHEAD;
    median / p90 %) on the campaign it was fitted to, quoted in the code and the docs that describe the model
  value: {conv_calls: 1303, conv_median: 2.8, conv_p90: 20.3, matmul_calls: 414, matmul_median: 4.7, matmul_p90: 17.6}
  provenance:
    date: 2026-10-12
    how: "Re-scored on 1cedaf2ed816 (HOSTOPS_PLAN §9.2, the campaign of the row-ops unit, 1938 exact calls): the constants
          as used ConvKernel 2.8 / 20.3 % over 1303 calls, MatmulKernel 4.7 / 17.6 % over 414; the plain refit's proposal
          (2.9 / 19.1 % and 4.7 / 17.6 %) NOT taken: tools/fit_cost_model.py diff (decision files rebuilt — the cached ones
          of 2026-10-11 replay the old comparison) moves SmolLM2-135M's and SmolVLM's prefill_16 60 MatMuls back from
          ConvKernel to the GEMV, +1.3 ms per run each by the measured entries, and nothing else; the call floor 443 -> 440
          cycles (1.76 us) with ONE / one +3, so no engine choice moves.  The shipped libraries now carry the f70ce632a97a
          refit's choices (regenerated with the unit in the same window).  Before: tools/fit_cost_model.py fit f70ce632a97a on its campaign (1701 exact calls, DEPTHWISE_PLAN §8.5: ConvKernel's x
          port off the CCI): the constants as used before scored ConvKernel 35.8 / 77.6 % over 1103 calls (bias +0.30: the
          x-path terms of the old board), MatmulKernel 4.5 / 18.1 % over 414; the proposal (applied: RTL_CONV_BOARD,
          RTL_COEF, CALL_OVERHEAD 431 -> 443 = the new call floor 1.77 us) 2.9 / 18.0 % and 4.7 / 17.8 %; `diff`: the
          CNNs, BERT and Piper keep every engine choice, SmolLM2-135M / SmolVLM / SmolLM2-360M prefill_16 move 60 / 60 / 160
          MatMuls from the GEMV to ConvKernel (kw 2 / 4), which the performance model's measured entries price 1.3 / 1.3 /
          40.1 ms per run cheaper (their libraries not regenerated yet).  Before: tools/fit_cost_model.py fit --shipped-weight 0.75 --decisions D (the decision-aware set: no shipped
          model's engine choice moves; OFFLOAD_PLAN §4.3) on the campaign of 6436623029f7 as of 1729 exact calls;
          the constants as used before (100 MHz, + 1500): ConvKernel 33.9 / 64.5 %, MatmulKernel 8.8 / 29.6 %;
          the plain refit 14.5 / 44.2 % (it moved BERT's P·V to MatmulKernel).  Re-scored on 588d721997cb
          (SOFTMAX_PLAN, 2026-10-07; the kernels' cycles unchanged) and kept: `fit 588d721997cb` gives the
          constants as used ConvKernel 18.7 / 48.2 % over 1265 calls, MatmulKernel 4.6 / 17.7 % over 414 (its
          proposal 15.1 / 45.1 %, not taken: the shipped libraries stay as gated); CALL_OVERHEAD 448 -> 434 with
          ONE / one +14, so no decision moves.  Re-scored on 8599aa7a5f12 (PS_PORTS_PLAN §5, 2026-10-08; the
          ConvKernel / MatmulKernel calls unchanged): the constants as used ConvKernel 18.6 / 48.3 % over 1265
          calls, MatmulKernel 4.5 / 17.7 % over 414; call floor 431 cycles: CALL_OVERHEAD 434 -> 431 with
          ONE / one +3"
    facts: {perf.bitstream_id: 1cedaf2ed816}  # a new bitstream: a new campaign, refit or re-score
  fix: report
  mentions:
    - {file: inference-scheduler/src/cost_model.py,
       regex: 'at 250 MHz, (?P<conv_calls>[\d ]+) calls, median (?P<conv_median>[\d.]+) %,\n# p90 (?P<conv_p90>[\d.]+) %'}
    - {file: inference-scheduler/src/cost_model.py,
       regex: 'at 250 MHz, (?P<matmul_calls>\d+) calls:\n# median (?P<matmul_median>[\d.]+) %, p90 (?P<matmul_p90>[\d.]+) %'}
    - {file: doc/scheduler/INFERENCE_SCHEDULER.md, dotall: true,
       regex: 'x and weight runs; median (?P<conv_median>[\d.]+) %, p90 (?P<conv_p90>[\d.]+) % over the\s+(?P<conv_calls>[\d ]+) ConvKernel calls'}
    - {file: doc/kernels/CONV_RTL_KERNEL.md, dotall: true,
       regex: '`[0-9a-f]{12}`, median (?P<conv_median>[\d.]+) %, p90 (?P<conv_p90>[\d.]+) %'}
    - {file: .claude/skills/conv-cycle-model/SKILL.md, dotall: true,
       regex: '[0-9a-f]{12}: median (?P<conv_median>[\d.]+) %, p90 (?P<conv_p90>[\d.]+) %;'}
  # OFFLOAD_PLAN §4.3's table is the dated record of this fit

- id: cost_model.conv_anchors
  kind: value
  title: the board anchors test_rtl_conv_model pins conv_board_cycles to (cycles net of the call floor) and
    the model's estimate of BERT's per-head P·V, as INFERENCE_SCHEDULER.md quotes them
  source:
    parts:
      big_board: {file: inference-scheduler/test/test_matmul_on_conv.py,
                  regex: '(?s)def test_rtl_conv_model.*?conv_board_cycles\(\*\*big\)\["total"\] / (\d+) - 1\)', type: int}
      pv_board: {file: inference-scheduler/test/test_matmul_on_conv.py,
                 regex: '(?s)def test_rtl_conv_model.*?conv_board_cycles\(\*\*pv\)\["total"\] / (\d+) - 1\)', type: int}
      pv_board_ms: {file: inference-scheduler/test/test_matmul_on_conv.py,
                    regex: '(?s)def test_rtl_conv_model.*?conv_board_cycles\(\*\*pv\)\["total"\] / (\d+) - 1\)',
                    transform: 'round(int(v) / 250e3, 2)'}
      pv_model: {py: 'src.cost_model:round(conv_board_cycles(in_ch=256, out_ch=256, in_h=1, in_w=64, oh=1, ow=64, kh=1, kw=1)["total"])',
                 cwd: inference-scheduler}
  fix: report
  mentions:
    - {file: inference-scheduler/test/test_matmul_on_conv.py, regex: 'testbench, (?P<big_board>[\d ]+) on the board \(grid-bound\)'}
    - {file: inference-scheduler/test/test_matmul_on_conv.py, regex: 'channels, 64 pixels\) (?P<pv_board>[\d ]+) on the board'}
    - {file: doc/scheduler/INFERENCE_SCHEDULER.md, dotall: true,
       regex: 'per-head attention P·V conv: (?P<pv_board>[\d ]+) cycles on the\s+board \((?P<pv_board_ms>[\d.]+) ms at 250 MHz\), (?P<pv_model>[\d ]+) predicted'}

# ── the scheduler CLI ────────────────────────────────────────────────────────
- id: cli.inference_scheduler
  kind: interface
  title: inference_scheduler.py's flags in its option lists
  check: cli_flags
  args:
    script: inference-scheduler/inference_scheduler.py
    cwd: inference-scheduler
    docs:
      - {file: inference-scheduler/CLAUDE.md, start: '^## CLI$', end: '^## '}
      - {file: inference-scheduler/doc/USER_GUIDE.md, start: '^### Options$', end: '^### '}

# ── kernel register maps ─────────────────────────────────────────────────────
# HLS s_axilite ports = the driver header = what the generated code, the
# benchmarks and the calibration runner write; the performance model keys on
# all of them except the not_keyed ones; the timeline decodes FIELDS only.
- id: registers.VectorOPKernel
  kind: interface
  title: VectorOPKernel AXI-Lite registers
  check: register_map
  args:
    kernel: VectorOPKernel
    prefix: XVectoropkernel
    rtl_driver: kernels/vectorop_rtl/scripts/gen_driver.py   # the truth: the RTL kernel's table,
    rtl: kernels/vectorop_rtl/rtl/vo_ctrl_s_axi.sv            # checked against its control block
    hls: kernels/vectorop_rtl/model/src/VectorOP.cpp          # the C++ reference model: same ports
    driver: 'build*/kernels/vectorop_rtl/driver/VectorOPKernel_v1_0/src/xvectoropkernel_hw.h'
    not_keyed: {a: address, b: address, c: address, alpha: LeakyReLU slope (no effect on timing),
                smx_cm: softmax scale (no effect on timing), smx_cfg: softmax shift / P exponent (no effect on timing),
                smx_mask: "softmax valid lengths (every element is processed: no effect on timing)"}
    decode: inference-scheduler/src/timeline_html.py
    writers_all:
      - inference-scheduler/src/codegen/_source.py
      - inference-scheduler/bench_src/calib_runner.c
      - inference-scheduler/bench_src/bench_vectorop.c

- id: rtl.axi_masters
  kind: value
  title: the RTL kernels' AXI masters — burst lengths and outstanding bursts per port, which the IPs
    declare on their m_axi interfaces (the block design sizes the crossbar from them) and the
    testbenches enforce
  source:
    parts:
      mm_rd_burst: {file: kernels/matmul_rtl/rtl/mm_pkg.sv, regex: 'localparam int RD_BURST +=\s*(\d+);', type: int}
      mm_rd_outs: {file: kernels/matmul_rtl/rtl/mm_pkg.sv, regex: 'localparam int RD_OUTS +=\s*(\d+);', type: int}
      mm_wr_burst: {file: kernels/matmul_rtl/rtl/mm_pkg.sv, regex: 'localparam int WR_BURST +=\s*(\d+);', type: int}
      mm_wr_outs: {file: kernels/matmul_rtl/rtl/mm_pkg.sv, regex: 'localparam int WR_OUTS +=\s*(\d+);', type: int}
      vo_rd_burst: {file: kernels/vectorop_rtl/rtl/vo_pkg.sv, regex: 'localparam int RD_BURST +=\s*(\d+);', type: int}
      vo_rd_outs: {file: kernels/vectorop_rtl/rtl/vo_pkg.sv, regex: 'localparam int RD_OUTS +=\s*(\d+);', type: int}
      vo_wr_burst: {file: kernels/vectorop_rtl/rtl/vo_pkg.sv, regex: 'localparam int WR_BURST +=\s*(\d+);', type: int}
      vo_wr_outs: {file: kernels/vectorop_rtl/rtl/vo_pkg.sv, regex: 'localparam int WR_OUTS +=\s*(\d+);', type: int}
      pl_rd_burst: {file: kernels/pool_rtl/rtl/pl_pkg.sv, regex: 'localparam int RD_BURST +=\s*(\d+);', type: int}
      pl_rd_outs: {file: kernels/pool_rtl/rtl/pl_pkg.sv, regex: 'localparam int RD_OUTS +=\s*(\d+);', type: int}
      pl_wr_burst: {file: kernels/pool_rtl/rtl/pl_pkg.sv, regex: 'localparam int WR_BURST +=\s*(\d+);', type: int}
      pl_wr_outs: {file: kernels/pool_rtl/rtl/pl_pkg.sv, regex: 'localparam int WR_OUTS +=\s*(\d+);', type: int}
      cv_x_burst: {file: kernels/conv_rtl/rtl/cv_pkg.sv, regex: 'localparam int X_BURST = (\d+),', type: int}
      cv_x_outs: {file: kernels/conv_rtl/rtl/cv_pkg.sv, regex: 'X_OUTS = (\d+);', type: int}
      cv_w_burst: {file: kernels/conv_rtl/rtl/cv_pkg.sv, regex: 'localparam int W_BURST = (\d+),', type: int}
      cv_w_outs: {file: kernels/conv_rtl/rtl/cv_pkg.sv, regex: 'W_OUTS = (\d+);', type: int}
      cv_b_burst: {file: kernels/conv_rtl/rtl/cv_pkg.sv, regex: 'localparam int B_BURST = (\d+),', type: int}
      cv_b_outs: {file: kernels/conv_rtl/rtl/cv_pkg.sv, regex: 'B_OUTS = (\d+);', type: int}
      cv_y_burst: {file: kernels/conv_rtl/rtl/cv_pkg.sv, regex: 'localparam int Y_BURST = (\d+),', type: int}
      cv_y_outs: {file: kernels/conv_rtl/rtl/cv_pkg.sv, regex: 'Y_OUTS = (\d+);', type: int}
  fix: report                                # an IP change: repackage, rebuild, re-measure
  mentions:
    - {file: kernels/matmul_rtl/syn/package_ip.tcl, regex: 'NUM_READ_OUTSTANDING (?P<mm_rd_outs>\d+) NUM_WRITE_OUTSTANDING (?P<mm_wr_outs>\d+)'}
    - {file: kernels/matmul_rtl/syn/package_ip.tcl,
       regex: 'gmem0 READ_ONLY (?P<mm_rd_burst>\d+) \d+  gmem1 READ_ONLY \d+ \d+  gmem2 WRITE_ONLY \d+ (?P<mm_wr_burst>\d+)'}
    - {file: kernels/matmul_rtl/tb/verilator/tb_main.cpp, regex: 'rd1\.outs_limit = (?P<mm_rd_outs>\d+);  wr\.outs_limit = (?P<mm_wr_outs>\d+);'}
    - {file: kernels/vectorop_rtl/syn/package_ip.tcl, regex: 'NUM_READ_OUTSTANDING (?P<vo_rd_outs>\d+) NUM_WRITE_OUTSTANDING (?P<vo_wr_outs>\d+)'}
    - {file: kernels/vectorop_rtl/syn/package_ip.tcl,
       regex: 'gmem0 READ_ONLY (?P<vo_rd_burst>\d+) \d+  gmem1 READ_ONLY \d+ \d+  gmem2 WRITE_ONLY \d+ (?P<vo_wr_burst>\d+)'}
    - {file: kernels/vectorop_rtl/tb/verilator/tb_main.cpp, regex: 'rd1\.outs_limit = (?P<vo_rd_outs>\d+);  wr\.outs_limit = (?P<vo_wr_outs>\d+);'}
    - {file: kernels/pool_rtl/syn/package_ip.tcl, regex: 'gmem0 READ_ONLY (?P<pl_rd_outs>\d+) \d+  gmem1 WRITE_ONLY \d+ (?P<pl_wr_outs>\d+)'}
    - {file: kernels/pool_rtl/syn/package_ip.tcl, regex: 'MAX_READ_BURST_LENGTH (?P<pl_rd_burst>\d+) MAX_WRITE_BURST_LENGTH (?P<pl_wr_burst>\d+)'}
    - {file: kernels/pool_rtl/tb/verilator/tb_main.cpp, regex: 'rd\.outs_limit = (?P<pl_rd_outs>\d+);  wr\.outs_limit = (?P<pl_wr_outs>\d+);'}
    - {file: kernels/conv_rtl/syn/package_ip.tcl,
       regex: 'gmem0 READ_ONLY (?P<cv_x_outs>\d+) \d+ (?P<cv_x_burst>\d+) \d+   gmem1 READ_ONLY (?P<cv_w_outs>\d+) \d+ (?P<cv_w_burst>\d+) \d+'}
    - {file: kernels/conv_rtl/syn/package_ip.tcl,
       regex: 'gmem2 READ_ONLY (?P<cv_b_outs>\d+) \d+ (?P<cv_b_burst>\d+) \d+  gmem3 WRITE_ONLY \d+ (?P<cv_y_outs>\d+) \d+ (?P<cv_y_burst>\d+)'}
    - {file: kernels/conv_rtl/tb/verilator/tb_main.cpp,
       regex: 'rx\.outs_limit = (?P<cv_x_outs>\d+);  rw\.outs_limit = (?P<cv_w_outs>\d+);  rb\.outs_limit = (?P<cv_b_outs>\d+);  wy\.outs_limit = (?P<cv_y_outs>\d+);'}

