- id: hw.utilization
  kind: recorded
  title: the production bitstream and its FPGA utilization (README)
  value: {bitstream: 1cedaf2ed816, dsp: 833, dsp_total: 1248, dsp_pct: 67, lut: 93969, lut_total: 117120, lut_pct: 80.2,
          bram: 136, bram_total: 144, uram: 55, uram_total: 64}
  tolerance: 0.5                             # the docs round the percentages
  provenance:
    date: 2026-10-12
    how: "Vivado placed utilization report of the 250 MHz design with the RowOpsKernel (the row-ops unit) and its
          interconnect on HP0 (HOSTOPS_PLAN phase 3, /mnt/data/bitstreams/kv260_250_1cedaf2ed816/: +31 351 LUT,
          FF 87 832 -> 113 020, +5 BRAM tiles, +7 URAM, +121 DSP; WNS +0.020 ns); f70ce632a97a before it:
          LUT 62 618, DSP 712, BRAM 131, URAM 48 — ConvKernel's x read port on HP2 and its
          two line-buffer copies (DEPTHWISE_PLAN §8, /mnt/data/bitstreams/kv260_250_f70ce632a97a/: +218 LUT,
          FF 87 781 -> 87 832, +8 BRAM tiles — the second copy of the 16 RAMB18 line buffer); 8599aa7a5f12
          before it: LUT 62 400, BRAM 123 — VectorOPKernel's b read port on HPC1
          (PS_PORTS_PLAN §5, /mnt/data/bitstreams/kv260_250_8599aa7a5f12/: +53 LUT, FF 87 703 -> 87 781; the
          interconnects only); 588d721997cb before it: LUT 62 347 — VectorOPKernel's softmax unit
          (SOFTMAX_PLAN, /mnt/data/bitstreams/kv260_250_588d721997cb/: +5 599 LUT, +5 105 FF (87 703), +16 BRAM,
          +16 DSP); 6436623029f7 before it: LUT 56 748, DSP 696, BRAM 107 — the activation unit
          (ACTIVATIONS_PLAN, /mnt/data/bitstreams/kv260_250_6436623029f7/: +729 LUT, +1 233 FF, +4 BRAM, +8 DSP);
          986cef4866a0 before it: LUT 56 019, DSP 688, BRAM 103 — the 250 MHz design (FMAX_250_PLAN int6: the MMCM, register slices,
          the four kernels' register trees; /mnt/data/bitstreams/kv260_250_986cef4866a0/), FF 81 365 (48 328
          before); c2b2a6e5e50e before it (hw_128 850cc88, 100 MHz): LUT 56 516; the ConvKernel of CONV_RTL_PLAN
          phase 1; (dbb320fb7297
          before it, the HLS ConvKernel: LUT 75 472, DSP 973, BRAM 105; 7d8eefe's b3309f424562 before that,
          the HLS PoolingKernel: LUT 80 914, DSP 1038, BRAM 105.5; 68665fc1833a, the MatmulKernel IP without
          bus parameters: LUT 80 965; bbb9a37f73f8, the HLS VectorOPKernel: LUT 84 561, DSP 1060, BRAM 109.5)"
    facts: {perf.bitstream_id: 1cedaf2ed816}
