# KV260: keep the cores out of the PSCI core power-down idle state (cpu-sleep-0).
# TF-A v2.8 (xlnx 2023.2) + PMU firmware can lose the power-down handshake and
# park a core forever in psci_power_down_wfi (every task queued on it stalls,
# then any all-CPU cross-call hangs). WFI idle stays enabled.
# Installed as /etc/tmpfiles.d/kv260-no-cpu-powerdown.conf by demo/chat/deploy.py
# (doc/plans/CHAT_PLAN.md §18). Undo: delete that file and reboot.
w /sys/devices/system/cpu/cpu*/cpuidle/state1/disable - - - - 1
